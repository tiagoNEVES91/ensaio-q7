.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}

main{flex:1;padding:14px 16px 120px}

.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}
input.i,select.i{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:16px Inter,sans-serif;padding:8px 12px}
label.l{display:block;font-weight:600;margin:14px 0 6px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--fg);font:inherit;cursor:pointer}
.t .nm{font-weight:600;line-height:1.3}
.t .mt{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.t.off{opacity:.5;cursor:not-allowed}
.hr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hr b{font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}.sum .r>span:last-child{white-space:nowrap}
.sum .r .k{color:var(--muted)}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.warn{background:var(--warn-bg);color:var(--warn)}.msg.err{background:var(--err-bg);color:var(--err)}.msg.info{background:var(--info-bg);color:var(--info)}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.step .v{text-align:center;font-size:20px;font-weight:700}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6}
.foot .in{max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.foot .line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.foot .line b{color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.theme{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:600 13px Inter,sans-serif;padding:6px 10px;cursor:pointer}
.small{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:12px}
ol.next{padding-left:20px;margin:8px 0 0}ol.next li{margin:6px 0}

const hm=dt=>dt.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Lisbon'});
const diaKey=dt=>dt.toLocaleDateString('en-CA',{timeZone:'Europe/Lisbon'});
const diaNome=k=>{const hoje=diaKey(new Date()),am=diaKey(new Date(T()+864e5));if(k===hoje)return 'Hoje';if(k===am)return 'Amanhã';const x=new Date(k+'T12:00:00Z');return x.toLocaleDateString('pt-PT',{weekday:'short'}).replace('.','')+' '+x.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})};
const prazo=t=>new Date(d(t.inicio).getTime()-LIMITE_HORAS*36e5);
const aberto=t=>T()<prazo(t).getTime();
const curto=n=>n.replace(/\s*\[(8|9|6)-Max[^\]]*\]/i,m=>m).replace(/,\s*\$[\d.,]+[KM]?\s*GTD/i,'').replace(/\s+-\s+\$[\d,]+(,\d+)*\s*GTD/i,'').trim();

// ---- contas (iguais às da folha "Controlo compras ação" e do formulário do Asana)
function contas(t,pct,ent,rbPct,eur,fx){
  const rbEntrada=t.rake*rbPct*pct;                        // K: RB a devolver por entrada
  const porEntrada=pct*(t.buyin+t.rake)-rbEntrada;         // o que se envia por entrada
  const usd=ent*porEntrada;                                // L: valor a enviar (moeda do torneio)
  const eurV=eur&&fx?Math.round(usd*fx*100)/100:null;      // N: em euros, se o saldo da sala for em €
  return {rbEntrada,porEntrada,usd,eur:eurV,parteEntradas:ent*pct*(t.buyin+t.rake),rbTotal:ent*rbEntrada};
}
function checklist(t,pct,c){
  const out=[];
  out.push(aberto(t)?['ok',`Pedido dentro do prazo (até ${LIMITE_HORAS} h antes do início)`]:['err',`Prazo fechado: era até ${hm(prazo(t))}`]);
  out.push(pct<=LIMITES.pct?['ok',`% até ${LIMITES.pct*100}%`]:['warn',`% acima de ${LIMITES.pct*100}%: vai para revisão`]);
  out.push(c.usd<=LIMITES.valor?['ok',`Valor até ${money(LIMITES.valor)}`]:['warn',`Valor acima de ${money(LIMITES.valor)}: vai para revisão`]);
  return out;
}

// ---- ecrãs
function lista(){
  const tors=(CAT?.torneios||[]).filter(t=>d(t.inicio).getTime()>T()-36e5);
  const dias=[...new Set(tors.map(t=>diaKey(d(t.inicio))))].slice(0,10);
  const fechados=tors.filter(t=>!aberto(t)&&(ST.sala==='todas'||t.sala===ST.sala)).length;
  let L=tors.filter(t=>aberto(t)&&(ST.sala==='todas'||t.sala===ST.sala)&&(ST.dia==='todos'||diaKey(d(t.inicio))===ST.dia)&&(!ST.q||t.nome.toLowerCase().includes(ST.q.toLowerCase())));
  let h=`<input class="i" id="q" placeholder="Procurar torneio (ex.: GGMillion, Venom)" value="${esc(ST.q)}" autocomplete="off">
  <div class="chips" style="margin-top:10px">${['todas','GGPoker','PokerStars','WPN'].map(s=>`<button class="chip" data-sala="${s}" aria-pressed="${ST.sala===s}">${s==='todas'?'Todas as salas':s}</button>`).join('')}</div>
  <div class="chips" style="margin-top:6px"><button class="chip" data-dia="todos" aria-pressed="${ST.dia==='todos'}">Todos os dias</button>${dias.map(k=>`<button class="chip" data-dia="${k}" aria-pressed="${ST.dia===k}">${diaNome(k)}</button>`).join('')}</div>`;
  if(fechados)h+=`<p class="small" style="margin:12px 0 0">${fechados} ${fechados===1?'torneio já fechou':'torneios já fecharam'} o prazo (pede-se até ${LIMITE_HORAS} h antes do início).</p>`;
  if(!L.length)return h+`<div class="empty">Nenhum torneio com estes filtros.</div>`;
  let ult='';
  for(const t of L.slice(0,120)){
    const k=diaKey(d(t.inicio));if(k!==ult){h+=`<div class="day">${diaNome(k)}</div>`;ult=k}
    const ab=aberto(t);
    h+=`<button class="t${ab?'':' off'}" data-id="${esc(t.id)}" ${ab?'':'aria-disabled="true"'}>
      <div class="hr"><span class="nm">${esc(curto(t.nome))}</span><b>${money(t.buyin+t.rake)}</b></div>
      <div class="mt"><span>${hm(d(t.inicio))} · ${esc(t.sala)}</span>${t.garantido?`<span class="tag">GTD ${money(t.garantido)}</span>`:''}${t.varios_dias?'<span class="tag info">vários dias</span>':''}${ab?`<span class="tag ok">pedir até ${hm(prazo(t))}</span>`:'<span class="tag warn">prazo fechado</span>'}</div></button>`;
  }
  return h+`<p class="small" style="margin-top:14px">Lista da SharkScope de ${esc(new Date(CAT.gerado_em).toLocaleString('pt-PT',{timeZone:'Europe/Lisbon',dateStyle:'short',timeStyle:'short'}))}: GG, PokerStars e WPN, buy-in a partir de $500, sem satélites. Atualiza todas as manhãs.</p>`;
}
function pedido(){
  const t=ST.sel;const rb=parseFloat(String(ST.rb).replace(',','.'))/100;const rbOk=rb>=0&&rb<=1;
  const c=contas(t,ST.pct,ST.ent,rbOk?rb:0,ST.eur,ST.fx);
  let h=`<div class="card"><div class="nm" style="font-weight:700">${esc(curto(t.nome))}</div>
    <div class="small" style="margin-top:4px">${esc(t.sala)} · ${diaNome(diaKey(d(t.inicio)))} às ${hm(d(t.inicio))} · late reg até ${t.fim_late_reg?hm(d(t.fim_late_reg)):'—'}</div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag">buy-in ${money(t.buyin)}</span><span class="tag">rake ${money(t.rake)}</span>${t.varios_dias?'<span class="tag info">vários dias</span>':''}</div></div>
  <label class="l">Que % vendes à Polarize?</label>
  <div class="pct">${[0.3,0.4,0.5,0.6].map(p=>`<button class="btn${ST.pct===p?' p':''}" data-pct="${p}">${p*100}%</button>`).join('')}</div>
  <div class="pct" style="margin-top:6px">${[0.45,0.55,0.7,0.8].map(p=>`<button class="btn${ST.pct===p?' p':''}" data-pct="${p}">${Math.round(p*100)}%</button>`).join('')}</div>
  <label class="l">Quantas entradas?</label>
  <div class="step"><button class="btn" data-ent="-1" aria-label="Menos">−</button><div class="v">${ST.ent}</div><button class="btn" data-ent="1" aria-label="Mais">+</button></div>
  <div class="hint">Conta as re-entradas que podes fazer. As que não usares voltam à Polarize.</div>
  <label class="l" for="rb">O teu rakeback nesta sala (%)</label>
  <input class="i" id="rb" inputmode="decimal" placeholder="ex.: 40" value="${esc(ST.rb)}" autocomplete="off">
  <div class="hint">${ST.rb===''?'Lembramo-nos do valor para a próxima vez nesta sala.':rbOk?'A parte da Polarize no rakeback é descontada já no valor que recebes.':'Escreve um número entre 0 e 100.'}</div>`;
  if(SALAS[t.sala]?.eur)h+=`<label class="l">O teu saldo na ${esc(t.sala)} é em…</label>
  <div class="pct" style="grid-template-columns:1fr 1fr"><button class="btn${!ST.eur?' p':''}" data-eur="0">Dólares</button><button class="btn${ST.eur?' p':''}" data-eur="1">Euros</button></div>
  ${ST.eur?`<div class="hint">O torneio é em dólares; envia-se em euros ao câmbio de hoje (${ST.fx?NF.format(ST.fx):'…'}${ST.fxData?' · BCE '+ST.fxData:' · valor de recurso, sem ligação'}). O desconto do prémio também é em euros.</div>`:''}`;
  if(rbOk&&ST.rb!==''){
    const m=ST.eur&&c.eur!=null?'EUR':'USD',v=m==='EUR'?c.eur:c.usd;
    h+=`<div class="card sum" style="margin-top:16px">
      <div class="r"><span class="k">${Math.round(ST.pct*100)}% de ${ST.ent} ${ST.ent===1?'entrada':'entradas'} de ${money(t.buyin+t.rake)}</span><span>${money(c.parteEntradas)}</span></div>
      <div class="r"><span class="k">Menos o rakeback da Polarize (${money(t.rake)} × ${NF.format(rb*100)}% × ${Math.round(ST.pct*100)}%${ST.ent>1?' × '+ST.ent:''})</span><span>−${money(c.rbTotal)}</span></div>
      <div class="r tot"><span>Recebes na Luxon</span><span>${money(v,m)}</span></div>
      ${m==='EUR'?`<div class="small">= ${money(c.usd)} ao câmbio de hoje</div>`:''}
    </div>
    <div class="msg info">Se fizeres ITM, <b>${Math.round(ST.pct*100)}% do prémio</b> (bounties incluídos) é da Polarize: descontas no registo da sessão e levantas logo para devolver.</div>`;
    const ck=checklist(t,ST.pct,c);
    h+=`<div style="margin-top:12px">${ck.map(([k,txt])=>`<div class="small" style="margin:4px 0;color:var(--${k==='ok'?'ok':k==='warn'?'warn':'err'})">${k==='ok'?'✓':k==='warn'?'!':'✕'} ${esc(txt)}</div>`).join('')}</div>
    <details><summary>Limites usados neste protótipo</summary><p class="small">São exemplos para discutir: % até ${LIMITES.pct*100}% e até ${money(LIMITES.valor)} por torneio passam sozinhos; acima disso vai para revisão da gestão. Pedido até ${LIMITE_HORAS} h antes do início.</p></details>`;
  }
  return h;
}
function enviado(p){
  return `<div class="msg ${p.estado==='aprovado'?'ok':'warn'}" style="font-size:16px"><b>${p.estado==='aprovado'?'Pedido aprovado':'Pedido enviado para revisão'}</b><br>${esc(curto(p.nome))} · ${Math.round(p.pct*100)}% · ${p.ent} ${p.ent===1?'entrada':'entradas'}</div>
  <div class="card" style="margin-top:12px"><b>O que acontece a seguir</b><ol class="next">
    ${p.estado==='aprovado'?'':'<li>A gestão vê o pedido e aprova ou recusa até ao prazo.</li>'}
    <li>Aceitas o contrato desta compra.</li>
    <li>A Polarize envia <b>${money(p.valor,p.moeda)}</b> para a tua Luxon.</li>
    <li>Pões esse valor na ${esc(p.sala)}. <b>Não é depósito do deal</b>: no registo da sessão o tracker mostra-o à parte.</li>
    <li>Jogas. Sem prémio, não tens de registar nada sobre a compra.</li>
    <li>Com prémio, o tracker desconta os ${Math.round(p.pct*100)}% da Polarize na sessão e pede-te para levantar esse valor e devolver.</li>
  </ol></div>
  <button class="btn big" style="margin-top:14px" data-go="minhas">Ver as minhas compras</button>`;
}
function minhas(){
  if(!MINHAS.length)return `<div class="empty">Ainda não pediste nenhuma compra.<br><br><button class="btn" data-go="lista">Ver torneios</button></div>`;
  return MINHAS.slice().reverse().map(p=>`<div class="card" style="margin-bottom:8px"><div class="hr"><span class="nm" style="font-weight:600">${esc(curto(p.nome))}</span><b>${money(p.valor,p.moeda)}</b></div>
    <div class="small" style="margin-top:4px">${esc(p.sala)} · ${diaNome(diaKey(d(p.inicio)))} ${hm(d(p.inicio))} · ${Math.round(p.pct*100)}% · ${p.ent} ${p.ent===1?'entrada':'entradas'} · RB ${NF.format(p.rb*100)}%</div>
    <div style="margin-top:8px;display:flex;gap:6px;align-items:center"><span class="tag ${p.estado==='aprovado'?'ok':'warn'}">${p.estado==='aprovado'?'aprovado':'em revisão'}</span>${aberto(p)?`<button class="btn sm" data-cancel="${esc(p.pid)}">Cancelar</button>`:'<span class="small">firme (passou o prazo)</span>'}</div></div>`).join('')
  +`<p class="small">Protótipo: os pedidos ficam só neste telemóvel.</p>`;
}
function foot(){
  const f=$('#foot'),fi=$('#footIn');
  if(ST.step!=='pedido'){f.hidden=true;return}
  const t=ST.sel,rb=parseFloat(String(ST.rb).replace(',','.'))/100,ok=ST.rb!==''&&rb>=0&&rb<=1&&aberto(t);
  let v='—';if(ok){const c=contas(t,ST.pct,ST.ent,rb,ST.eur,ST.fx);v=ST.eur&&c.eur!=null?money(c.eur,'EUR'):money(c.usd)}
  f.hidden=false;fi.innerHTML=`<div class="line"><span>Recebes</span><b>${v}</b></div><button class="btn p big" id="pedir" ${ok?'':'disabled'}>${!aberto(t)?'Prazo fechado':ST.rb===''?'Falta o teu rakeback':'Pedir compra'}</button>`;
  const b=$('#pedir');if(b&&ok)b.onclick=pedir;
}
function render(){
  const m=$('#main');
  $('#back').hidden=ST.step==='lista'||ST.step==='minhas';
  $('#ttl').textContent=ST.step==='pedido'?'Pedido de compra':ST.step==='enviado'?'Pedido feito':ST.tab==='minhas'?'As minhas compras':'Vender ação';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===ST.tab)));
  m.innerHTML=ST.step==='pedido'?pedido():ST.step==='enviado'?enviado(MINHAS[MINHAS.length-1]):ST.tab==='minhas'?minhas():lista();
  foot();
  const q=$('#q');if(q){q.oninput=e=>{ST.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
  const rb=$('#rb');if(rb){rb.oninput=e=>{ST.rb=e.target.value.replace(/[^\d.,]/g,'');const pos=e.target.selectionStart;render();const n=$('#rb');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
}
function pedir(){
  const t=ST.sel,rb=parseFloat(String(ST.rb).replace(',','.'))/100,c=contas(t,ST.pct,ST.ent,rb,ST.eur,ST.fx);
  const rev=checklist(t,ST.pct,c).some(x=>x[0]!=='ok');
  ST.rbSala[t.sala]=ST.rb;
  MINHAS.push({pid:Date.now().toString(36),id:t.id,nome:t.nome,sala:t.sala,inicio:t.inicio,pct:ST.pct,ent:ST.ent,rb,valor:ST.eur&&c.eur!=null?c.eur:c.usd,moeda:ST.eur&&c.eur!=null?'EUR':'USD',estado:rev?'revisao':'aprovado',em:new Date().toISOString()});
  guardar();ST.step='enviado';render();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){ST.tab=b.dataset.tab;ST.step=ST.tab;render();window.scrollTo(0,0);return}
  if(b.id==='back'){ST.step=ST.tab==='minhas'?'minhas':'lista';render();return}
  if(b.dataset.go){ST.tab=b.dataset.go;ST.step=b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.dataset.sala){ST.sala=b.dataset.sala;render();return}
  if(b.dataset.dia){ST.dia=b.dataset.dia;render();return}
  if(b.dataset.id){const t=CAT.torneios.find(x=>x.id===b.dataset.id);if(!t||!aberto(t))return;
    ST.sel=t;ST.pct=0.5;ST.ent=1;ST.rb=(ST.rbSala||{})[t.sala]||'';ST.eur=false;ST.step='pedido';render();window.scrollTo(0,0);return}
  if(b.dataset.pct){ST.pct=parseFloat(b.dataset.pct);render();return}
  if(b.dataset.ent){ST.ent=Math.max(1,Math.min(20,ST.ent+parseInt(b.dataset.ent,10)));render();return}
  if(b.dataset.eur){ST.eur=b.dataset.eur==='1';render();return}
  if(b.dataset.cancel){MINHAS=MINHAS.filter(p=>p.pid!==b.dataset.cancel);guardar();render();return}
});
render();
</script>
</body>
</html>
