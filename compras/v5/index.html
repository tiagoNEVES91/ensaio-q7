const NOW=()=>S.agora;
const d=iso=>new Date(iso);
const tz={timeZone:'Europe/Lisbon'};
const hm=ms=>new Date(ms).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',...tz});
const diaKey=ms=>new Date(ms).toLocaleDateString('en-CA',tz);
const diaCurto=ms=>{const x=new Date(ms);return x.toLocaleDateString('pt-PT',{weekday:'short',...tz}).replace('.','')+' '+x.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',...tz})};
const diaNome=ms=>{const k=diaKey(ms);if(k===diaKey(NOW()))return 'Hoje';if(k===diaKey(NOW()+24*H))return 'Amanhã';if(k===diaKey(NOW()-24*H))return 'Ontem';return diaCurto(ms)};
const quando=ms=>`${diaNome(ms)} ${hm(ms)}`;
const horasLisboa=ms=>Number(new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',hour12:false,...tz}));
const mesDe=ms=>new Date(ms).toLocaleDateString('pt-PT',{month:'long',...tz});
const mesKey=ms=>diaKey(ms).slice(0,7);
const ini=t=>d(t.inicio).getTime();
const prazo=t=>ini(t)-LIMITE_HORAS*H;
const aberto=t=>NOW()<prazo(t);
// fim estimado de cada dia de jogo (a SharkScope não dá a duração): fim do late reg + 5 h; um Day 2 joga-se 24 h depois do início
const fimDia1=c=>(c.fim_late_reg?d(c.fim_late_reg).getTime():ini(c)+3*H)+5*H;
const inicioDia2=c=>ini(c)+24*H;
const fimDia2=c=>inicioDia2(c)+10*H;
const proximoFimDeJogo=c=>c.estado==='aberta'?fimDia2(c):fimDia1(c);
const diaDaSessao=()=>{const n=NOW();return horasLisboa(n)<10?n-24*H:n}; // como no tracker: antes das 10:00 a sessão é de ontem

// ---------------- regras ----------------
const salaDaRede=rede=>S.salas.find(s=>s.rede===rede);
function contas(t,pct,ent,rb,moedaEnvio,fx){
  const rbEntrada=t.rake*rb*pct,porEntradaUSD=pct*(t.buyin+t.rake)-rbEntrada,k=moedaEnvio==='EUR'?fx:1;
  return {rbEntrada,porEntrada:r2(porEntradaUSD*k),valor:r2(ent*porEntradaUSD*k),usd:r2(ent*porEntradaUSD),parte:ent*pct*(t.buyin+t.rake),rbTotal:ent*rbEntrada};
}
const ATIVOS=['revisao','aprovada','enviada','na_sala','aberta'];
const emAberto=()=>S.compras.filter(c=>ATIVOS.includes(c.estado)).reduce((a,c)=>a+c.usd,0);
function avaliar(t,pct,usd){
  const M=S.matriz,iN=M.niveis.findIndex(x=>S.nivel<=x.max),bi=t.buyin+t.rake,iF=M.faixas.findIndex(x=>bi<=x.max),c=M.celulas[iN][iF],out=[];
  out.push(aberto(t)?['ok',`Dentro do prazo (até ${LIMITE_HORAS} h antes)`]:['err','Prazo fechado']);
  out.push(c.p===0?['warn',`Nível ${String(S.nivel).replace('.',',')}: nesta faixa de buy-in nada passa sozinho`]:pct<=c.p+1e-9?['ok',`% até ${pctTxt(c.p)} (nível ${M.niveis[iN].n}, buy-in ${M.faixas[iF].n})`]:['warn',`% acima de ${pctTxt(c.p)} para o nível ${M.niveis[iN].n} nesta faixa`]);
  if(c.p>0)out.push(usd<=c.v+.005?['ok',`Valor até ${money(c.v)}`]:['warn',`Valor acima de ${money(c.v)} para o nível ${M.niveis[iN].n} nesta faixa`]);
  const gtdMin=M.gtdMult*bi;out.push(!t.garantido||t.garantido>=gtdMin?['ok',`Garantido de pelo menos ${M.gtdMult}× o buy-in`]:['warn',`Garantido baixo (${money(t.garantido)}; mínimo ${money(gtdMin)})`]);
  const ab=emAberto()+usd;out.push(ab<=M.abertoMax?['ok',`Total em aberto até ${money(M.abertoMax)}`]:['warn',`Ficava com ${money(ab)} em aberto (máximo ${money(M.abertoMax)})`]);
  return out;
}
const hist=(c,txt,quem,t)=>{(c.hist||=[]).push({t:t??NOW(),txt,quem})};
const op=(o)=>S.ops.push({...o,t:NOW()});

// ---------------- o tempo passa: efeitos automáticos ----------------
function aplicarTempo(){
  for(const c of S.compras){
    // pedido sem decisão até ao início: fica sem efeito
    if(c.estado==='revisao'&&NOW()>=ini(c)){c.estado='expirada';hist(c,'Sem decisão da gestão até ao início: o pedido ficou sem efeito','sistema',ini(c))}
    // aprovada mas a Polarize não enviou até ao início
    if(c.estado==='aprovada'&&NOW()>=ini(c)&&!c.avisoNaoEnviada){c.avisoNaoEnviada=true;hist(c,'O torneio começou e o valor ainda não tinha sido enviado','sistema',ini(c))}
  }
}

// ---------------- avisos ----------------
function avisos(papel){
  const A=[];const n=NOW();
  const add=(nivel,txt,sub,ir,pid)=>A.push({nivel,txt,sub,ir,pid});
  for(const c of S.compras){
    const nm=curto(c.nome);
    if(papel==='jogador'){
      if(c.estado==='revisao')add('info',`À espera da gestão: ${nm}`,`Decide até ao início (${quando(ini(c))})`,null);
      if(c.estado==='aprovada')add('info',`Compra aprovada: ${nm}`,`A Polarize envia ${money(c.valor,c.moeda)} para a tua Luxon`,null);
      if(c.estado==='enviada'){
        if(n<ini(c))add(n>ini(c)-H?'err':'warn',`Põe ${money(c.valor,c.moeda)} na ${c.salaNome}`,`Recebeste na Luxon. O torneio começa ${quando(ini(c))}`,['ops'],c.pid);
        else add('err',`O torneio começou e o dinheiro da compra não está na sala`,`${nm}: põe-no já, ou avisa a gestão`,['ops'],c.pid);
      }
      if(['na_sala','aberta'].includes(c.estado)&&n>=proximoFimDeJogo(c)){
        const atr=Math.floor((n-proximoFimDeJogo(c))/(24*H));
        add(atr>=1?'err':'warn',`Regista a sessão com a compra: ${nm}`,atr>=1?`O ${c.estado==='aberta'?'Day 2':'torneio'} acabou há ${atr} ${atr===1?'dia':'dias'}`:`O ${c.estado==='aberta'?'Day 2':'torneio'} acabou (fim estimado ${hm(proximoFimDeJogo(c))})`,['sessoes'],c.pid);
      }
      if(c.estado==='a_devolver'){const dias=Math.floor((n-c.tDev)/(24*H));
        add(dias>=1?'err':'warn',`Devolve ${money(c.devolver,c.moeda)} à Polarize`,dias>=1?`${nm}: em atraso há ${dias} ${dias===1?'dia':'dias'}`:`${nm}: levanta da sala e envia hoje`,['ops'],c.pid)}
      if(c.estado==='recusada'&&n-c.tFim<24*H)add('info',`Pedido recusado: ${nm}`,c.motivoRecusa||'',null);
      if(c.estado==='expirada'&&n-ini(c)<24*H)add('info',`Pedido sem efeito: ${nm}`,'A gestão não decidiu até ao início',null);
    }else{
      if(c.estado==='revisao')add(n>ini(c)-2*H?'err':'warn',`Pedido por decidir: ${nm}`,`${S.jogador} · ${pctTxt(c.pct)} · ${money(c.valor,c.moeda)} · fecha às ${hm(ini(c))} (${diaNome(ini(c))})`,['painel'],c.pid);
      if(c.estado==='aprovada')add(n>=ini(c)-H?'err':'warn',`Enviar ${money(c.valor,c.moeda)} ao ${S.jogador}`,`${nm} · começa ${quando(ini(c))}${n>=ini(c)?' — JÁ COMEÇOU':''}`,['painel'],c.pid);
      if(c.estado==='enviada'&&n>=ini(c))add('warn',`Enviado mas não posto na sala`,`${nm}: o jogador ainda não marcou que pôs o dinheiro na ${c.salaNome}`,['compras'],c.pid);
      if(['na_sala','aberta'].includes(c.estado)&&n>=proximoFimDeJogo(c)+24*H)add('err',`O ${S.jogador} não registou a sessão da compra`,`${nm}: acabou ${quando(proximoFimDeJogo(c))}`,['compras'],c.pid);
      if(c.estado==='a_devolver'&&n-c.tDev>=48*H)add('err',`Devolução em atraso: ${money(c.devolver,c.moeda)}`,`${nm}: há ${Math.floor((n-c.tDev)/(24*H))} dias. Falar com o jogador`,['compras'],c.pid);
      if(c.estado==='devolucao_enviada')add('warn',`Confirmar receção de ${money(c.devolver,c.moeda)}`,`${nm} · print: ${c.print||'—'}`,['painel'],c.pid);
    }
  }
  if(papel==='gestao'){
    const mesAnt=S.compras.filter(c=>mesKey(ini(c))<mesKey(n)&&!S.extratos[mesKey(ini(c))]).map(c=>mesKey(ini(c)));
    for(const m of [...new Set(mesAnt)])add('warn',`Enviar o extrato de ${new Date(m+'-15').toLocaleDateString('pt-PT',{month:'long'})} ao ${S.jogador}`,'É o anexo do contrato do mês',['matriz'],null);
  }
  const ord={err:0,warn:1,info:2};return A.sort((a,b)=>ord[a.nivel]-ord[b.nivel]);
}
function proximoEvento(){
  const n=NOW(),T=[];
  for(const c of S.compras){
    if(['revisao','aprovada','enviada'].includes(c.estado))T.push(ini(c));
    if(c.estado==='na_sala')T.push(fimDia1(c));
    if(c.estado==='aberta')T.push(inicioDia2(c),fimDia2(c));
    if(c.estado==='a_devolver')T.push(c.tDev+24*H,c.tDev+48*H);
  }
  const fut=T.filter(t=>t>n+60e3).sort((a,b)=>a-b);
  return fut[0]||null;
}

function compraDaSala(id){return S.compras.filter(c=>c.salaId===id&&['na_sala','aberta'].includes(c.estado))}
function novaSessao(){
  const com=S.salas.filter(s=>compraDaSala(s.id).length).map(s=>s.id);
  UI.sess={inicio:'',fim:'',ntorneios:'',salas:(com.length?com:['gg']).map(id=>({id,final:''})),compras:{}};
}
function calcSala(row){
  // saldo do deal = saldo final real − dinheiro da compra que continua na sala − o que se devolve à Polarize
  const s=S.salas.find(x=>x.id===row.id),fin=num(row.final);let keep=0,novoDev=0;const falta=[];
  const pend=r2(S.compras.filter(c=>c.salaId===s.id&&c.estado==='a_devolver').reduce((a,c)=>a+c.devolver,0));
  for(const c of compraDaSala(s.id)){
    const r=UI.sess.compras[c.pid];
    if(!r||!r.estado){falta.push(c);keep+=c.naSala;continue}
    if(r.estado==='nao'){if(naoJogouDeVez(c))novoDev+=c.naSala;else keep+=c.naSala;continue}
    const usadas=Math.min(c.ent,(c.usadas||0)+(r.usadas||(c.estado==='aberta'?0:1))),restoEnt=r2((c.ent-usadas)*c.porEntrada),pITM=r2((num(r.premio)||0)*c.pct+(c.devPremioAcum||0));
    if(c.varios_dias&&r.acabou==='nao')keep+=restoEnt+pITM;else novoDev+=restoEnt+pITM;
  }
  keep=r2(keep+pend);novoDev=r2(novoDev);const finalDeal=isNaN(fin)?NaN:r2(fin-keep-novoDev);
  return {s,fin,keep,novoDev,finalDeal,pl:isNaN(finalDeal)?NaN:r2(finalDeal-s.saldo),falta};
}
// "não joguei" depois de fechar o late reg de um torneio que ainda não começou para ele = não vai jogar: devolve tudo

          ${c.varios_dias?`<label class="l">O torneio acabou para ti?</label><div class="seg"><button class="btn sm${r.acabou!=='nao'?' p':''}" data-ca="${c.pid}" data-v="sim">Acabou</button><button class="btn sm${r.acabou==='nao'?' p':''}" data-ca="${c.pid}" data-v="nao">Passei ao Day 2</button></div>`:''}`;

function sessaoValida(){
  const F=UI.sess;if(!F)return 'Falta preencher';

  if(!/^\d{2}:\d{2}$/.test(F.inicio)||!/^\d{2}:\d{2}$/.test(F.fim))return 'Faltam as horas (HH:MM)';
  for(const row of F.salas){const k=calcSala(row);if(isNaN(k.fin))return 'Falta o Saldo Final';if(k.falta.length)return 'Diz como correu a compra';if(k.finalDeal<0)return 'O saldo do deal não pode ser negativo'}

function criarSessao(){
  const F=UI.sess,linhas=[];
  for(const row of F.salas){
    const k=calcSala(row),s=k.s;
    for(const c of compraDaSala(s.id)){
      const r=F.compras[c.pid];if(!r)continue;
      if(r.estado==='nao'){if(naoJogouDeVez(c)){c.devEntradas=c.naSala;c.devPremio=0;c.devolver=c.naSala;c.naSala=0;c.estado='a_devolver';c.tDev=NOW();hist(c,`Registado na sessão: não jogou. A devolver ${money(c.devolver,c.moeda)}`,'jogador')}else hist(c,'Registado na sessão: não jogou nesse dia','jogador');continue}
      const antes=c.usadas||0;c.usadas=Math.min(c.ent,antes+(r.usadas||(c.estado==='aberta'?0:1)));
      const premio=num(r.premio)||0;c.premio=r2((c.premio||0)+premio);
      const restoEnt=r2((c.ent-c.usadas)*c.porEntrada),acum=r2((c.devPremioAcum||0)+premio*c.pct);
      if(c.varios_dias&&r.acabou==='nao'){c.devPremioAcum=acum;c.naSala=r2(restoEnt+acum);c.estado='aberta';hist(c,`Registado na sessão: passou ao Day 2 (${c.usadas} ${c.usadas===1?'entrada usada':'entradas usadas'})`,'jogador')}
      else{c.devPremio=acum;c.devEntradas=restoEnt;c.devolver=r2(acum+restoEnt);c.naSala=0;c.tDev=NOW();
        c.estado=c.devolver>0?'a_devolver':'fechada';if(c.estado==='fechada')c.tFim=NOW();
        hist(c,`Registado na sessão: ${premio?`prémio ${money(premio,c.moeda)}`:'sem prémio'}, ${c.usadas}/${c.ent} ${c.ent===1?'entrada':'entradas'}${c.devolver?`. A devolver ${money(c.devolver,c.moeda)}`:'. Fechada, nada a devolver'}`,'jogador')}
    }
    s.compra=r2(compraDaSala(s.id).reduce((a,c)=>a+c.naSala,0)+S.compras.filter(c=>c.salaId===s.id&&c.estado==='a_devolver').reduce((a,c)=>a+c.devolver,0));
    linhas.push({sala:s.nome,moeda:s.moeda,finalReal:k.fin,finalDeal:k.finalDeal,pl:k.pl});
    S.makeup[s.moeda]=r2(S.makeup[s.moeda]+k.pl);s.saldo=k.finalDeal;
  }

}

  return meses.map(m=>{
    const cs=S.compras.filter(c=>mesKey(ini(c))===m&&!['recusada','expirada','cancelada','revisao'].includes(c.estado));const nome=new Date(m+'-15').toLocaleDateString('pt-PT',{month:'long'});
    const fim=mesKey(NOW())>m;
    return `<div class="h2">Extrato de ${nome} · ${esc(S.jogador)}</div><div class="small" style="margin-bottom:8px">Anexo do contrato do mês (${S.contratos[m]?'<b style="color:var(--ok)">aceite</b>':'<b style="color:var(--warn)">por aceitar</b>'}). ${S.extratos[m]?`Enviado ${quando(S.extratos[m])}.`:fim?'O mês acabou: falta enviar.':'O mês ainda não acabou.'}</div>
    <div class="scroll"><table class="ex"><tr><th>Torneio</th><th>%</th><th>Ent.</th><th>Enviado</th><th>Prémio</th><th>Devolvido</th><th>Estado</th></tr>${cs.map(c=>`<tr><td>${esc(curto(c.nome))}</td><td>${pctTxt(c.pct)}</td><td>${c.usadas||0}/${c.ent}</td><td>${money(c.valor,c.moeda)}</td><td>${c.premio?money(c.premio,c.moeda):'—'}</td><td>${c.estado==='fechada'&&c.devolver?money(c.devolver,c.moeda):['a_devolver','devolucao_enviada'].includes(c.estado)?'por receber':'—'}</td><td>${esc((ESTADOS[c.estado]||[])[1]||c.estado)}</td></tr>`).join('')}</table></div>
    ${fim&&!S.extratos[m]?`<button class="btn p" style="margin-top:8px" data-extrato="${m}">Enviar extrato de ${nome}</button>`:''}`}).join('');
}

// ---------------- render ----------------
function render(){
  aplicarTempo();
  const n=NOW();$('#relogio').innerHTML=`${diaCurto(n)} · ${hm(n)}<small>relógio da simulação</small>`;
  document.querySelectorAll('[data-papel]').forEach(b=>b.classList.toggle('on',b.dataset.papel===S.papel));
  const G=S.papel==='gestao';$('#hdr').classList.toggle('g',G);$('#nav').classList.toggle('g',G);
  $('#banca').innerHTML=S.salas.map(s=>`<span>${esc(s.rede)} <b>${money(s.saldo,s.moeda)}</b>${s.compra?` + compra ${money(s.compra,s.moeda)}`:''}</span>`).join('')+`<span>Makeup <b>${money(S.makeup.USD)}</b>${S.makeup.EUR?` · ${money(S.makeup.EUR,'EUR')}`:''}</span>`;
  const aJ=avisos('jogador').filter(a=>a.nivel!=='info').length,aG=avisos('gestao').length;
  const T=G?[['painel','🛡','Painel',aG],['compras','📋','Compras',0],['jogador','👤','Jogador',0],['matriz','🧮','Matriz',S.compras.some(c=>mesKey(ini(c))<mesKey(n)&&!S.extratos[mesKey(ini(c))])?1:0]]
           :[['inicio','🏠','Início',aJ],['vender','🎯','Vender ação',0],['sessoes','📝','Sessões',0],['ops','💸','Operações',S.compras.filter(c=>['enviada','a_devolver'].includes(c.estado)).length]];
  const tab=G?UI.tabG:UI.tabJ;
  $('#tabs').innerHTML=T.map(([k,ic,nm,p])=>`<button data-tab="${k}" aria-pressed="${tab===k}"><span class="ic">${ic}</span>${nm}${p?`<span class="n">${p}</span>`:''}</button>`).join('');
  const sub=!G&&((tab==='vender'&&UI.step!=='lista')||(tab==='ops'&&UI.op));$('#back').hidden=!sub;
  const titulos={painel:'Gestão · Painel',compras:'Gestão · Compras',jogador:'Gestão · '+S.jogador,matriz:'Gestão · Matriz e extratos',inicio:'Início',sessoes:'Nova Sessão',ops:UI.op?(UI.op.tipo==='pôr'?'Pôr na sala':'Devolver à Polarize'):'Operações',
    vender:UI.step==='pedido'?'Pedido de compra':UI.step==='contrato'?'Contrato do mês':UI.step==='enviado'?'Pedido feito':'Vender ação'};
  $('#ttl').textContent=titulos[tab];
  let h='';if(UI.flash){h+=`<div class="msg ok">${esc(UI.flash)}</div>`;UI.flash=''}
  if(G)h+=tab==='painel'?vPainel():tab==='compras'?vComprasG():tab==='jogador'?vJogadorG():vMatriz()+`<button class="btn" style="width:100%;margin-top:24px" data-act="reset">Recomeçar a simulação</button>`;
  else h+=tab==='inicio'?vInicio():tab==='vender'?(UI.step==='pedido'?vPedido():UI.step==='contrato'?vContrato():UI.step==='enviado'?vEnviado():vLista()):tab==='sessoes'?vSessoes():UI.op?vOpForm():vOps();
  $('#main').innerHTML=h;foot();ligar();guardar();
}
function vEnviado(){
  const c=S.compras[S.compras.length-1];const st=c.estado==='aprovada'?['ok','Pedido aprovado pela matriz']:['warn','Pedido enviado para a gestão aprovar'];
  return `<div class="msg ${st[0]}" style="font-size:16px"><b>${st[1]}</b><br>${esc(curto(c.nome))} · ${pctTxt(c.pct)} · ${c.ent} ${c.ent===1?'entrada':'entradas'} · ${money(c.valor,c.moeda)}</div>
  <div class="card"><b>O que acontece a seguir</b><ol class="next">${c.estado==='revisao'?`<li>A gestão aprova ou recusa até ao início (${quando(ini(c))}).</li>`:''}
    <li>A Polarize envia <b>${money(c.valor,c.moeda)}</b> para a tua Luxon.</li><li>Em Operações, pões esse valor na ${esc(c.salaNome)}: fica como dinheiro da compra, <b>não</b> como banca.</li>
    <li>Registas a sessão como sempre. O tracker separa sozinho o que é da compra.</li></ol></div>
  <div class="small">Para ver o outro lado, carrega em <b>🛡 Gestão</b> lá em cima.</div>`;
}
function foot(){
  const f=$('#foot'),fi=$('#footIn'),G=S.papel==='gestao';
  if(!G&&UI.tabJ==='vender'&&UI.step==='pedido'){
    const t=UI.sel,rb=num(UI.rb)/100,ok=UI.rb!==''&&rb>=0&&rb<=1&&aberto(t),sala=salaDaRede(t.sala);
    f.hidden=false;fi.innerHTML=`<div class="line"><span>Recebes</span><b>${ok?money(contas(t,UI.pct,UI.ent,rb,sala.moeda,UI.fx).valor,sala.moeda):'—'}</b></div><button class="btn p big" data-act="pedir" ${ok?'':'disabled'}>${!aberto(t)?'Prazo fechado':UI.rb===''?'Falta o teu rakeback':'Pedir compra'}</button>`;return}
  if(!G&&UI.tabJ==='sessoes'&&UI.sess&&!S.sessoes.some(x=>x.dia===diaKey(diaDaSessao()))){const e=sessaoValida();let pl='';
    for(const row of UI.sess.salas){const k=calcSala(row);if(!isNaN(k.pl))pl+=`${pl?' · ':''}${k.s.rede} <b style="color:var(--${k.pl>=0?'ok':'err'})">${k.pl>=0?'+':''}${money(k.pl,k.s.moeda)}</b>`}
    f.hidden=false;fi.innerHTML=`<div class="line"><span>P&L do deal</span><span>${pl||'—'}</span></div><button class="btn p big" data-act="criarSessao" ${e?'disabled':''}>${e||'Criar Sessão'}</button>`;return}
  f.hidden=true;
}
function ligar(){
  const keep=(id,fn)=>{const el=document.getElementById(id);if(el)el.oninput=e=>{fn(e.target.value);const pos=e.target.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}};
  const fh=v=>{const t=v.replace(/\D/g,'').slice(0,4);return t.length===4?t.slice(0,2)+':'+t.slice(2):t};
  keep('q',v=>UI.q=v);keep('rb',v=>UI.rb=v.replace(/[^\d.,]/g,''));
  keep('sIni',v=>UI.sess.inicio=fh(v));keep('sFim',v=>UI.sess.fim=fh(v));keep('sNt',v=>UI.sess.ntorneios=v.replace(/\D/g,''));
  document.querySelectorAll('[data-final]').forEach(el=>{el.id='fin'+el.dataset.final;keep(el.id,v=>UI.sess.salas[+el.dataset.final].final=v)});
  document.querySelectorAll('[data-cp]').forEach(el=>{el.id='cp'+el.dataset.cp;keep(el.id,v=>{(UI.sess.compras[el.dataset.cp]||={}).premio=v})});
  document.querySelectorAll('[data-salarow]').forEach(el=>el.onchange=e=>{UI.sess.salas[+el.dataset.salarow].id=e.target.value;render()});
  document.querySelectorAll('[data-mx]').forEach(el=>el.onchange=e=>{const [i,j]=el.dataset.mx.split(',').map(Number),c=S.matriz.celulas[i][j];c.p=parseFloat(e.target.value);if(c.p&&!c.v)c.v=5000;render()});
  document.querySelectorAll('[data-mxg]').forEach(el=>el.onchange=e=>{const v=num(e.target.value);if(v>0)S.matriz[el.dataset.mxg]=v;render()});
  const pf=document.getElementById('printDev');if(pf)pf.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f){UI.op.print=f.name;render()}};
}
function pedir(){
  const t=UI.sel,sala=salaDaRede(t.sala),rb=num(UI.rb)/100,m=mesKey(NOW());
  if(!S.contratos[m]){UI.step='contrato';render();window.scrollTo(0,0);return}
  const c=contas(t,UI.pct,UI.ent,rb,sala.moeda,UI.fx),ck=avaliar(t,UI.pct,c.usd),passa=ck.every(x=>x[0]==='ok');
  const cp={pid:Date.now().toString(36),id:t.id,nome:t.nome,sala:t.sala,salaId:sala.id,salaNome:sala.nome,inicio:t.inicio,fim_late_reg:t.fim_late_reg,varios_dias:t.varios_dias,
    pct:UI.pct,ent:UI.ent,rb,moeda:sala.moeda,valor:c.valor,usd:c.usd,porEntrada:c.porEntrada,estado:passa?'aprovada':'revisao',aprov:passa?'matriz':null,motivos:ck.filter(x=>x[0]!=='ok').map(x=>x[1]),usadas:0,naSala:0,premio:0,hist:[]};
  hist(cp,`Pedido: ${pctTxt(cp.pct)}, ${cp.ent} ${cp.ent===1?'entrada':'entradas'}, RB ${String(r2(rb*100)).replace('.',',')}% → ${money(cp.valor,cp.moeda)}`,'jogador');
  hist(cp,passa?'Aprovado pela matriz':'Fora da matriz: vai para a gestão ('+cp.motivos.join('; ')+')','sistema');
  S.compras.push(cp);S.rbSala[t.sala]=UI.rb;UI.step='enviado';render();window.scrollTo(0,0);
}
function avancar(ms){S.agora=ms;UI.sess=null;render()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.tempo){const n=NOW();
    if(ds.tempo==='dia'){const k=diaKey(n+24*H);let t=Date.parse(k+'T08:00:00Z');if(horasLisboa(t)===8)t+=H;avancar(t)}
    else if(ds.tempo==='evento'){const p=proximoEvento();if(p)avancar(p+60e3);else{UI.flash='Nada marcado à frente: avança um dia ou pede uma compra.';render()}}
    else avancar(n+Number(ds.tempo)*H);return}
  if(ds.papel){S.papel=ds.papel;UI.op=null;render();window.scrollTo(0,0);return}
  if(ds.tab){if(S.papel==='gestao')UI.tabG=ds.tab;else{UI.tabJ=ds.tab;UI.op=null;if(ds.tab==='vender')UI.step='lista'}render();window.scrollTo(0,0);return}
  if(ds.ir){if(S.papel==='gestao')UI.tabG=ds.ir;else{UI.tabJ=ds.ir;UI.op=null}if(ds.pid)UI.aberta=ds.pid;render();window.scrollTo(0,0);return}
  if(b.id==='back'){if(UI.tabJ==='ops')UI.op=null;else UI.step=UI.step==='contrato'?'pedido':'lista';render();return}
  if(ds.sala){UI.sala=ds.sala;render();return}
  if(ds.dia){UI.dia=ds.dia;render();return}
  if(ds.fg){UI.fg=ds.fg;render();return}
  if(ds.tl){UI.aberta=UI.aberta===ds.tl?null:ds.tl;render();return}
  if(ds.id){const t=CAT.torneios.find(x=>x.id===ds.id);if(!t||!aberto(t))return;UI.sel=t;UI.pct=.5;UI.ent=1;UI.rb=S.rbSala[t.sala]||'';UI.step='pedido';render();window.scrollTo(0,0);return}
  if(ds.pct){UI.pct=parseFloat(ds.pct);render();return}
  if(ds.ent&&UI.tabJ==='vender'){UI.ent=Math.max(1,Math.min(20,UI.ent+parseInt(ds.ent,10)));render();return}
  if(ds.nivel){S.nivel=parseFloat(ds.nivel);render();return}
  if(ds.extrato){S.extratos[ds.extrato]=NOW();render();return}
  if(ds.cancelar){const c=S.compras.find(x=>x.pid===ds.cancelar);c.estado='cancelada';hist(c,'Cancelada pelo jogador antes do prazo','jogador');render();return}
  const a=ds.act;
  if(a==='pedir'){pedir();return}
  if(a==='aceitarContrato'){S.contratos[mesKey(NOW())]=NOW();pedir();return}
  if(a==='reset'){const tema=null;S=NOVO();UI.tabJ='inicio';UI.tabG='painel';UI.step='lista';UI.sess=null;UI.op=null;render();window.scrollTo(0,0);return}
  if(ds.op){UI.op={tipo:ds.op,pid:ds.pid};render();window.scrollTo(0,0);return}
  if(a==='confirmarPor'){const c=S.compras.find(x=>x.pid===UI.op.pid);S.luxon[c.moeda]=r2(S.luxon[c.moeda]-c.valor);c.estado='na_sala';c.naSala=c.valor;
    const s=S.salas.find(x=>x.id===c.salaId);s.compra=r2(s.compra+c.valor);hist(c,`Posto na ${c.salaNome}`,'jogador');
    op({tipo:'Compra de ação → sala',desc:`${curto(c.nome)} · Luxon Pay ${c.moeda} → ${c.salaNome} (fora da banca)`,valor:c.valor,moeda:c.moeda,estado:'Finalizado'});
    UI.op=null;UI.flash='Dinheiro da compra registado na sala. A tua banca do deal não mudou.';render();return}
  if(a==='confirmarDev'){const c=S.compras.find(x=>x.pid===UI.op.pid);c.estado='devolucao_enviada';c.print=UI.op.print;
    const s=S.salas.find(x=>x.id===c.salaId);s.compra=r2(Math.max(0,s.compra-c.devolver));hist(c,`Devolução enviada (${money(c.devolver,c.moeda)}), com print`,'jogador');
    op({tipo:'Devolução de compra de ação',desc:`${curto(c.nome)} · ${c.salaNome} → Luxon → Polarize`,valor:c.devolver,moeda:c.moeda,estado:'Pendente',pid:c.pid});
    UI.op=null;UI.flash='Devolução enviada. A gestão confirma a receção.';render();return}
  if(ds.g){const c=S.compras.find(x=>x.pid===ds.pid);
    if(ds.g==='aprovar'){c.estado='aprovada';c.aprov='gestao';hist(c,'Aprovado pela gestão','gestão')}
    if(ds.g==='recusar'){c.estado='recusada';c.tFim=NOW();c.motivoRecusa='Fora dos limites para o nível';hist(c,'Recusado pela gestão','gestão')}
    if(ds.g==='enviar'){c.estado='enviada';S.luxon[c.moeda]=r2(S.luxon[c.moeda]+c.valor);hist(c,`Enviado ${money(c.valor,c.moeda)} para a Luxon do jogador`,'gestão');
      op({tipo:'Compra de ação recebida',desc:`${curto(c.nome)} · ${pctTxt(c.pct)} · Polarize → Luxon Pay ${c.moeda}`,valor:c.valor,moeda:c.moeda,estado:'Finalizado'})}
    if(ds.g==='receber'){c.estado='fechada';c.tFim=NOW();hist(c,'Receção confirmada: compra fechada','gestão');const o=S.ops.find(x=>x.pid===c.pid&&x.estado==='Pendente');if(o)o.estado='Finalizado'}
    render();return}
  if(a==='criarSessao'){if(!sessaoValida())criarSessao();return}
  if(a==='novaSala'){const livre=S.salas.find(s=>!UI.sess.salas.some(r=>r.id===s.id));if(livre){UI.sess.salas.push({id:livre.id,final:''});render()}return}
  if(ds.rmsala){UI.sess.salas.splice(+ds.rmsala,1);render();return}
  if(ds.cj){(UI.sess.compras[ds.cj]||={}).estado=ds.v;render();return}
  if(ds.cu){const c=S.compras.find(x=>x.pid===ds.cu),r=UI.sess.compras[ds.cu];r.usadas=Math.max(1,Math.min(c.ent-(c.usadas||0),(r.usadas||1)+parseInt(ds.v,10)));render();return}
  if(ds.ca){UI.sess.compras[ds.ca].acabou=ds.v;render();return}
});
render();
</script>
</body>
