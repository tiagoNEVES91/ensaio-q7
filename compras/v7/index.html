const NOW=()=>S.agora,tz={timeZone:'Europe/Lisbon'},d=iso=>new Date(iso);
const hm=ms=>new Date(ms).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',...tz});
const diaKey=ms=>new Date(ms).toLocaleDateString('en-CA',tz);
const dataPT=ms=>new Date(ms).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',...tz});
const diaCurto=ms=>{const x=new Date(ms);return x.toLocaleDateString('pt-PT',{weekday:'short',...tz}).replace('.','')+' '+x.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',...tz})};
const diaNome=ms=>{const k=diaKey(ms);if(k===diaKey(NOW()))return 'Hoje';if(k===diaKey(NOW()+24*H))return 'Amanhã';if(k===diaKey(NOW()-24*H))return 'Ontem';return diaCurto(ms)};
const quando=ms=>`${diaNome(ms)} ${hm(ms)}`;
const horasLx=ms=>Number(new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',hour12:false,...tz}));
const mesKey=ms=>diaKey(ms).slice(0,7),mesNome=m=>new Date(m+'-15').toLocaleDateString('pt-PT',{month:'long'});
const ini=t=>d(t.inicio).getTime(),prazo=t=>ini(t)-LIMITE_HORAS*H,aberto=t=>NOW()<prazo(t);
const fimLR=c=>c.fim_late_reg?d(c.fim_late_reg).getTime():ini(c)+3*H;
const ultFlight=c=>c.flights&&c.flights.length?ini(c.flights[c.flights.length-1]):ini(c);
const fimDia1=c=>fimLR(c)+5*H,inicioDia2=c=>c.dia2?d(c.dia2).getTime():ultFlight(c)+24*H,fimDia2=c=>inicioDia2(c)+10*H;
const proxFim=c=>c.estado==='aberta'?fimDia2(c):fimDia1(c);
const diaSessao=()=>{const n=NOW();return typeof UI!=='undefined'&&UI.sess&&UI.sess.hoje?n:horasLx(n)<10?n-24*H:n};
// catálogo → eventos: os flights ([Day 1], [Day 1A]…, [Flight B]) do mesmo torneio juntam-se; o [Day 2] dá a data do Day 2
const TAG=/\s*\[(Day ?1[A-Z]?|1[A-Z]|(?:Final )?Flight(?: ?[A-Z0-9]+)?|Last Chance)\]/i,D2=/\s*\[(Day ?[2-9]|MAIN|Final Day)\]/i;
// chave do evento: sala + buy-in + garantido (a WPN dá nomes de skins diferentes ao mesmo torneio); sem garantido, o nome-base
const baseDe=n=>n.replace(TAG,'').replace(D2,'').replace(/\s+LAST$/i,'').trim(),chaveEv=(t,base)=>t.garantido?`fl|${t.sala}|${t.buyin}|${t.rake}|${t.garantido}`:`fl|${t.sala}|${base}|${t.buyin}|${t.rake}`;
// torneios semanais com flights (Turbo Tuesday da WPN): cada semana tem o seu Day 2 — o flight pertence ao evento do Day 2 seguinte
const EV=(()=>{const L=CAT?.torneios||[],g=new Map(),d2={},pon=(k,v)=>(d2[k]||=[]).push(v);for(const t of L)if(D2.test(t.nome)){const b=baseDe(t.nome);pon(chaveEv(t,b),t.inicio);pon(`fl|${t.sala}|${b}|${t.buyin}|${t.rake}`,t.inicio)}
  for(const k in d2)d2[k]=[...new Set(d2[k])].sort((a,b)=>Date.parse(a)-Date.parse(b));
  for(const t of L){if(D2.test(t.nome))continue;const m=TAG.test(t.nome),base=m?baseDe(t.nome):t.nome,k0=m?chaveEv(t,base):t.id;
    const ds=m?(d2[k0]||d2[`fl|${t.sala}|${base}|${t.buyin}|${t.rake}`]||[]):[],prox=ds.find(x=>Date.parse(x)>=Date.parse(t.inicio))||null,k=m?k0+'|'+(prox||'?'):k0;
    if(!g.has(k))g.set(k,{chave:k,sala:t.sala,base,nome:m?base+' [Day 1]':t.nome,buyin:t.buyin,rake:t.rake,garantido:t.garantido,varios_dias:!!(t.varios_dias||m),moeda:t.moeda,flights:[],dia2:m?prox:null});
    const e=g.get(k);e.flights.push({id:t.id,inicio:t.inicio,fim_late_reg:t.fim_late_reg,nome:t.nome});if((t.garantido||0)>(e.garantido||0))e.garantido=t.garantido}
  for(const e of g.values()){e.flights.sort((a,b)=>ini(a)-ini(b));if(e.flights.length===1)e.nome=e.flights[0].nome;e.id=e.flights.length===1?e.flights[0].id:'ev:'+e.sala+':'+e.base+':'+(e.buyin+e.rake)+(e.dia2?':'+e.dia2.slice(0,10):'')}
  return [...g.values()]})();
// o que se vê na lista: flights que ainda não começaram; o pedido vale para os que ainda estão no prazo
function eventosVisiveis(){const n=NOW();return EV.map(e=>{const fut=e.flights.filter(f=>ini(f)>n);if(!fut.length)return null;const ab=fut.filter(f=>n<prazo(f)),fl=ab.length?ab:fut,u=fl[fl.length-1];
  return {...e,flights:fl,inicio:fl[0].inicio,fim_late_reg:u.fim_late_reg||new Date(ini(u)+3*H).toISOString()}}).filter(Boolean).sort((a,b)=>ini(a)-ini(b))}
const fmtFlights=c=>(c.flights||[]).map(f=>diaCurto(ini(f))+' '+hm(ini(f))).join(' · ');

const INI=()=>String(S.jogador||'?').split(/\s+/).map(p=>p[0]||'').slice(0,2).join('').toUpperCase();

// saldo total como no tracker: salas (com o dinheiro das compras que lá está) + carteiras
function saldos(){const p={EUR:0,USD:0};for(const s of S.salas)p[s.moeda]+=s.saldo+(s.compra||0);p.USD+=S.luxon.USD;p.EUR+=S.luxon.EUR;for(const w of S.carteiras||[])p[w.moeda]+=w.saldo;return p}
function contas(t,pct,ent,rb,moeda,fx){const rbE=t.rake*rb*pct,porE=pct*(t.buyin+t.rake)-rbE,k=moeda==='EUR'?fx:1;
  return {rbE,porEntrada:r2(porE*k),valor:r2(ent*porE*k),usd:r2(ent*porE),parte:ent*pct*(t.buyin+t.rake),rbTotal:ent*rbE}}
const ATIVOS=['revisao','aprovada','enviada','na_sala','aberta'];
const ENVIADAS=['enviada','na_sala','aberta','a_devolver','devolucao_enviada','fechada'];
const emAberto=()=>S.compras.filter(c=>ATIVOS.includes(c.estado)).reduce((a,c)=>a+c.usd,0);
// cada compra pode ter várias devoluções: entradas não usadas (logo que se sabe), ITM (no fim), ou a compra inteira se ficou na Luxon
const devsDe=c=>c.devs||(c.devs=[]);
const devPend=c=>devsDe(c).filter(x=>x.estado==='a_devolver'),devEnv=c=>devsDe(c).filter(x=>x.estado==='enviada');
const somaDev=(c,est)=>r2(devsDe(c).filter(x=>!est||est.includes(x.estado)).reduce((a,x)=>a+x.valor,0));
const TIPO_DEV={entradas:'entradas não usadas',itm:'parte do prémio',luxon:'compra não usada (ficou na Luxon)'};
const emUSD=(v,m)=>m==='EUR'?v/UI.fx:v;
function addDev(c,tipo,valor,extra={}){valor=r2(valor);if(valor<=0.004)return null;const x={i:devsDe(c).length,tipo,valor,estado:'a_devolver',t:NOW(),...extra};c.devs.push(x);return x}
function fecharSeAcabou(c){if(!c.terminou)return;c.estado=devPend(c).length?'a_devolver':devEnv(c).length?'devolucao_enviada':'fechada';if(c.estado==='fechada'&&!c.tFim)c.tFim=NOW()}
const acaoG=c=>['revisao','aprovada'].includes(c.estado)||devEnv(c).length>0;
const faseTxt=c=>c.estado==='na_sala'&&c.qualificado?'qualificado · ainda pode jogar flights':c.estado==='aberta'&&devPend(c).length?'Day 2 · devolução por fazer':FASE[c.estado];
function avaliar(t,pct,usd){const M=S.matriz,iN=M.niveis.findIndex(x=>S.nivel<=x.max),bi=t.buyin+t.rake,iF=M.faixas.findIndex(x=>bi<=x.max),c=M.celulas[iN][iF],o=[];
  o.push(aberto(t)?['ok',`Dentro do prazo (até ${LIMITE_HORAS} h antes do início)`]:['err','Prazo fechado']);
  o.push(c.p===0?['warn',`Nível ${String(S.nivel).replace('.',',')}: nesta faixa de buy-in nada passa sozinho`]:pct<=c.p+1e-9?['ok',`% até ${pctTxt(c.p)} (nível ${M.niveis[iN].n}, buy-in ${M.faixas[iF].n})`]:['warn',`% acima de ${pctTxt(c.p)} para o nível ${M.niveis[iN].n} nesta faixa`]);
  if(c.p>0)o.push(usd<=c.v+.005?['ok',`Valor até ${money(c.v)}`]:['warn',`Valor acima de ${money(c.v)} para o nível ${M.niveis[iN].n} nesta faixa`]);
  const g=M.gtdMult*bi;o.push(!t.garantido||t.garantido>=g?['ok',`Garantido de pelo menos ${M.gtdMult}× o buy-in`]:['warn',`Garantido baixo (${money(t.garantido)}; mínimo ${money(g)})`]);
  const ab=emAberto()+usd;o.push(ab<=M.abertoMax?['ok',`Total em aberto até ${money(M.abertoMax)}`]:['warn',`Ficava com ${money(ab)} em aberto (máximo ${money(M.abertoMax)})`]);return o}
const hist=(c,txt,quem,t)=>(c.hist||=[]).push({t:t??NOW(),txt,quem});
const novaOp=o=>S.ops.push({...o,t:NOW()});
function juntarFlights(){for(const c of S.compras){if(!c.chave||!c.varios_dias||!['revisao','aprovada','enviada','na_sala'].includes(c.estado))continue;
  const e=EV.find(x=>x.chave===c.chave);if(!e)continue;const ja=new Set((c.flights||[]).map(f=>f.id)),ult=c.flights&&c.flights.length?ini(c.flights[c.flights.length-1]):ini(c);
  const novos=e.flights.filter(f=>!ja.has(f.id)&&ini(f)>ult);if(!novos.length)continue;c.flights=[...(c.flights||[]),...novos.map(f=>({id:f.id,inicio:f.inicio,fim_late_reg:f.fim_late_reg}))];
  const u=c.flights[c.flights.length-1];c.fim_late_reg=u.fim_late_reg||new Date(ini(u)+3*H).toISOString();if(e.dia2)c.dia2=e.dia2;hist(c,`Apareceram mais ${novos.length} flight(s) no catálogo: ${novos.map(f=>diaCurto(ini(f))+' '+hm(ini(f))).join(', ')}`,'sistema')}}
function aplicarTempo(){if(!S.perfil)for(const s of NOVO().salas)if(!S.salas.some(x=>x.id===s.id))S.salas.push(s);juntarFlights();for(const c of S.compras){
  if(c.estado==='revisao'&&NOW()>=ini(c)){c.estado='expirada';hist(c,'Sem decisão da gestão até ao início: o pedido ficou sem efeito','sistema',ini(c))}
  if(c.estado==='aprovada'&&NOW()>=ini(c)&&!c.avNE){c.avNE=1;hist(c,'O torneio começou e o valor ainda não tinha sido enviado','sistema',ini(c))}
  if(c.estado==='aprovada'&&NOW()>=fimLR(c)){c.estado='expirada';c.semEnvio=1;hist(c,'O late reg fechou sem o valor ter sido enviado: a compra ficou sem efeito','sistema',fimLR(c))}
  if(c.estado==='enviada'&&NOW()>=fimLR(c)){c.terminou=1;addDev(c,'luxon',c.valor,{t:fimLR(c)});fecharSeAcabou(c);hist(c,'O late reg fechou e o dinheiro não foi posto na sala: devolve-se da Luxon','sistema',fimLR(c))}}}

// ================= avisos =================
function avisos(papel){const A=[],n=NOW(),add=(nv,tx,sub,ir)=>A.push({nv,tx,sub,ir});
  for(const c of S.compras){const nm=curto(c.nome);
    if(papel==='jogador'){
      if(c.estado==='revisao')add('info',`À espera da gestão: ${nm}`,`Decide até ao início (${quando(ini(c))})`);
      if(c.estado==='aprovada')add('info',`Compra aprovada: ${nm}`,`A Polarize vai enviar ${money(c.valor,c.moeda)} para a tua Luxon`);
      if(c.estado==='enviada')n<ini(c)?add(n>ini(c)-H?'err':'warn',`Põe ${money(c.valor,c.moeda)} na ${c.salaNome}`,`Recebeste na Luxon. O torneio começa ${quando(ini(c))}`,['operacoes',c.pid]):add('err','O torneio começou e o dinheiro da compra não está na sala',`${nm}: põe-no já, ou avisa a gestão`,['operacoes',c.pid]);
      if(c.estado==='na_sala'&&c.flights&&c.flights.length>1&&n<fimLR(c)){const f=c.flights.find(f=>diaKey(ini(f))===diaKey(n));if(f)add('info',`Hoje há flight: ${nm}`,`${hm(ini(f))} · tens ${restantes(c)} de ${c.ent} entradas por usar`)}
      if(['na_sala','aberta'].includes(c.estado)&&n>=proxFim(c)){const a=Math.floor((n-proxFim(c))/(24*H));add(a>=1?'err':'warn',`Regista a sessão com a compra: ${nm}`,a>=1?`Acabou há ${a} ${a===1?'dia':'dias'}`:`Acabou (fim estimado ${hm(proxFim(c))})`,['sessao_nova',c.pid])}
      for(const x of devPend(c)){const a=Math.floor((n-x.t)/(24*H));add(a>=1?'err':'warn',`Devolve ${money(x.valor,c.moeda)} à Polarize`,`${nm} · ${TIPO_DEV[x.tipo]}: `+(a>=1?`em atraso há ${a} ${a===1?'dia':'dias'}`:x.tipo==='luxon'?'ainda está na tua Luxon, envia hoje':'levanta da sala e envia hoje'),['operacoes',c.pid+':'+x.i])}
      if(c.estado==='recusada'&&n-c.tFim<24*H)add('info',`Pedido recusado: ${nm}`,'Fora dos limites para o teu nível');
      if(c.estado==='expirada'&&n-ini(c)<24*H)add('info',`${c.semEnvio?'Compra sem efeito':'Pedido sem efeito'}: ${nm}`,c.semEnvio?'O valor não foi enviado a tempo':'A gestão não decidiu até ao início');
    }else{
      if(c.estado==='revisao')add(n>ini(c)-2*H?'err':'warn',`Pedido por decidir: ${nm}`,`${S.jogador} · ${pctTxt(c.pct)} · ${money(c.valor,c.moeda)} · fecha às ${hm(ini(c))} (${diaNome(ini(c))})`,['compras',c.pid]);
      if(c.estado==='aprovada')add(n>=ini(c)-H?'err':'warn',`Enviar ${money(c.valor,c.moeda)} ao ${S.jogador}`,`${nm} · começa ${quando(ini(c))}${n>=ini(c)?' · já começou':''}`,['compras',c.pid]);
      if(c.estado==='enviada'&&n>=ini(c))add('warn','Enviado mas não posto na sala',`${nm}: o jogador ainda não marcou que pôs o dinheiro na ${c.salaNome}`,['compras',c.pid]);
      if(['na_sala','aberta'].includes(c.estado)&&n>=proxFim(c)+24*H)add('err',`O ${S.jogador} não registou a sessão da compra`,`${nm}: acabou ${quando(proxFim(c))}`,['compras',c.pid]);
      for(const x of devPend(c))if(n-x.t>=48*H)add('err',`Devolução em atraso: ${money(x.valor,c.moeda)}`,`${nm} · ${TIPO_DEV[x.tipo]}: há ${Math.floor((n-x.t)/(24*H))} dias. Falar com o jogador`,['compras',c.pid]);
      for(const x of devEnv(c))add('warn',`Confirmar receção de ${money(x.valor,c.moeda)}`,`${nm} · ${TIPO_DEV[x.tipo]} · print: ${x.print||'—'}`,['compras',c.pid]);
    }}
  if(papel==='gestao')for(const m of [...new Set(S.compras.filter(c=>ENVIADAS.includes(c.estado)&&mesKey(ini(c))<mesKey(n)&&!S.extratos[mesKey(ini(c))]).map(c=>mesKey(ini(c))))])add('warn',`Enviar o extrato de ${mesNome(m)} ao ${S.jogador}`,'É o anexo do contrato do mês',['matriz']);
  const o={err:0,warn:1,info:2};return A.sort((a,b)=>o[a.nv]-o[b.nv])}
function proximoEvento(){const n=NOW(),T=[];for(const c of S.compras){if(['revisao','aprovada','enviada'].includes(c.estado))T.push(ini(c));if(['aprovada','enviada'].includes(c.estado))T.push(fimLR(c));if(c.estado==='na_sala'){T.push(fimDia1(c));for(const f of c.flights||[])T.push(ini(f))}if(c.estado==='aberta')T.push(inicioDia2(c),fimDia2(c));for(const x of devPend(c))T.push(x.t+24*H,x.t+48*H)}
  return T.filter(t=>t>n+6e4).sort((a,b)=>a-b)[0]||null}

    if(k==='ops'||k==='sessoes'){const sbs=new Set((b[k]||[]).map(J)),srs=new Set((r[k]||[]).map(J)),novos=(l[k]||[]).filter(x=>!sbs.has(J(x))&&!srs.has(J(x)));if(k==='sessoes'&&novos.some(x=>(r[k]||[]).some(y=>y.dia===x.dia)))return null;out[k]=[...(r[k]||[]),...novos];continue}
    return null}return out}
async function puxar(){if(!NUVEM||NUVEM.aEnviar)return;try{const r=await rpc('ce_teste_ler',{p_codigo:NUVEM.c,p_sala:NUVEM.sala,p_desde:NUVEM.versao});NUVEM.falhas=0;
    if(NUVEM.estado==='a ligar'){if(r.estado){NUVEM.versao=r.versao;NUVEM.sync=JSON.stringify(r.estado);estadoNuvem('ligado');S=r.estado;render()}else{const t=S.tema;S=NOVO();S.tema=t;NUVEM.versao=0;estadoNuvem('ligado');render()}return}
    estadoNuvem('ligado');if(r.estado&&r.versao>NUVEM.versao&&!NUVEM.aEnviar&&JSON.stringify(S)===NUVEM.sync){NUVEM.versao=r.versao;NUVEM.sync=JSON.stringify(r.estado);aplicarEstado(r.estado)}}
  catch(e){NUVEM.falhas++;estadoNuvem(/codigo_errado/.test(e.message)?'código errado':/404|PGRST202/.test(e.message)?'caixa por criar':'sem ligação')}}
if(NUVEM){puxar();setInterval(puxar,1500)}
let ultEstreito=estreito();window.addEventListener('resize',()=>{if(estreito()!==ultEstreito){ultEstreito=estreito();render()}});
