      if(c.estado==='aprovada')n>=i0-H?add(n>=i0?'err':'warn',`Ainda não chegou o dinheiro da compra: ${nm}`,`${n>=i0?'Já começou.':jaFl?'O 1.º flight já começou; o próximo é '+dd(i0)+'.':'Começa '+dd(i0)+'.'} Se não chegar antes de te inscreveres, joga sem a compra e fala com a gestão.`,['compras',c.pid],i0):add('info',`Compra aprovada: ${nm}`,`A Polarize vai enviar ${money(c.valor,c.moeda)} para a tua Luxon Pay ${c.moeda}${jaFl?' · próximo flight '+dd(i0):''}`,['compras',c.pid],i0);
      if(c.estado==='enviada'){if(fl?pF(c)!=null:n<ini(c))add(n>=i0-H?'err':'warn',`Põe ${money(c.valor,c.moeda)} na ${c.salaNome} · ${nm}`,`Recebeste na tua Luxon Pay ${c.moeda}. ${fl?'Próximo flight':'Começa'} ${dd(i0)}: põe na sala antes e marca em "Pôr na sala".`,['operacoes',c.pid],i0);
        else add('err',`O torneio começou e o dinheiro da compra não está na sala · ${nm}`,`Se o puseste na sala, marca já em "Pôr na sala". Se não vais jogar, volta à Polarize quando fechar o late reg (${dd(fimLR(c))}).`,['operacoes',c.pid],fimLR(c))}
      if(c.estado==='na_sala'&&fl&&n<fimLR(c)){const f=(c.flights||[]).find(f=>diaKey(ini(f))===diaKey(n)&&ini(f)>n);if(f)add('info',`Hoje há flight: ${nm}`,`${hm(ini(f))} · tens ${restantes(c)} de ${c.ent} entradas por usar`,['compras',c.pid],ini(f))}
      if(c.estado==='aberta'&&!c.proxT){const d2=inicioDia2(c);if(d2>n&&d2-n<36*H)add('info',`Day 2 ${dd(d2)}: ${nm}`,`${c.dia2?'':'Hora estimada: confirma no lobby. '}${c.naSala>0.004?'Tens '+money(c.naSala,c.moeda)+' da compra na sala para isto.':'Regista a sessão desse dia com o prémio que entrar.'}`,['compras',c.pid],d2)}
      if(['na_sala','aberta'].includes(c.estado)&&n>=proxFim(c)){const dia=diaJogo(c),est=c.estado==='aberta'&&(c.proxT||!c.dia2),a=est?0:Math.floor((n-proxFim(c))/(24*H)),ja=S.sessoes.some(x=>x.dia===dia);
        add(a>=1?'err':'warn',est?`Já se jogou o dia seguinte de ${nm}?`:`Regista a sessão${ja?'':' de '+dataPTk(dia)} com o resultado de ${nm}`,`${est?'A data não é conhecida: regista-o na sessão do dia em que jogares (se ainda não jogaste, ignora). ':ja?'A sessão desse dia já está registada: diz como correu na próxima. ':''}Entradas usadas, prémio com bounties e, se acabou para ti, a hand history. Prazo do contrato: ${dd(prz(c))}.`,['sessao_nova',c.pid],proxFim(c))}

      if(c.estado==='recusada'&&n-(c.tFim||n)<24*H)add('warn',`Pedido recusado: ${nm}`,c.motivoRecusa||'Fora dos limites para o teu nível',['compras',c.pid],n+48*H);

      if(c.estado==='expirada'&&n-(c.tFim||ini(c))<24*H)add('warn',`${c.semEnvio?'Compra sem efeito':'Pedido sem efeito'}: ${nm}`,c.semEnvio?'O valor não foi enviado a tempo. Joga só com o deal.':'A gestão não decidiu a tempo.',['compras',c.pid],n+48*H);

      if(c.pedeCorrecao&&c.estado!=='fechada')add('warn',`Rever a sessão de ${dataPTk(c.pedeCorrecao)} do ${S.jogador}`,`${nm}: o jogador disse depois que tinha posto o dinheiro na sala; a sessão desse dia foi registada sem a compra`,['compras',c.pid]);

      if(c.estado==='enviada'&&n>=i0-H)add(n>=i0?'err':'warn',`Enviado mas não posto na sala · ${nm}`,`${nm}: o ${S.jogador} ainda não marcou que pôs o dinheiro na ${c.salaNome}${fl?' (próximo flight '+dd(i0)+')':''}`,['compras',c.pid],i0);
      if(['na_sala','aberta'].includes(c.estado)&&!(c.estado==='aberta'&&(c.proxT||!c.dia2))&&n>=proxFim(c)+24*H)add('err',`O ${S.jogador} não registou a sessão de ${dataPTk(diaJogo(c))}`,`${nm}: o prazo de 48 h do contrato acaba ${dd(prz(c))}`,['compras',c.pid],proxFim(c));
      for(const x of devPend(c)){const v=venc(x);n<v?add('info',`Vais receber ${money(x.valor,c.moeda)} do ${S.jogador} · ${nm}`,`${nm} · ${TIPO_DEV[x.tipo]} · até ${dd(v)}`,['compras',c.pid],v):add(n-v>=24*H?'err':'warn',`Devolução em atraso: ${money(x.valor,c.moeda)} · ${nm}`,`${nm} · ${TIPO_DEV[x.tipo]}: era até ${dd(v)}. Falar com o jogador`,['compras',c.pid],v)}
      for(const x of devEnv(c)){if(x.lote){if(lotesVistos.has(x.lote))continue;lotesVistos.add(x.lote);const LT=loteDevs(x.lote);add(n-x.tEnv>=24*H?'err':'warn',`Confirmar receção de ${money(r2(LT.reduce((a,o)=>a+o.x.valor,0)),c.moeda)}`,`${S.jogador} · ${LT.length} devoluções num só envio (${[...new Set(LT.map(o=>curto(o.c.nome)))].join(', ')}) · print: ${x.print||'—'}`,['compras',c.pid],x.tEnv);continue}
        add(n-(x.tEnv||n)>=24*H?'err':'warn',`Confirmar receção de ${money(x.valor,c.moeda)}`,`${nm} · ${TIPO_DEV[x.tipo]} · print: ${x.print||'—'}`,['compras',c.pid],x.tEnv)}
      if(c.estado==='cancelada'&&c.foiAprovada&&n-(c.tFim||n)<24*H)add(n-(c.tFim||n)<2*H?'warn':'info',`Compra cancelada pelo jogador: ${nm}`,`Não envies ${money(c.valor,c.moeda)}. Se já enviaste, pede a devolução.`,['compras',c.pid]);
      if(c.estado==='expirada'&&!c.semEnvio&&n-(c.tFim||ini(c))<24*H)add('info',`Pedido caducou sem decisão: ${nm}`,`${S.jogador} · ${pctTxt(c.pct)} · ${money(c.valor,c.moeda)}`,['compras',c.pid]);
    }}
  if(papel==='gestao')for(const m of [...new Set(S.compras.filter(c=>ENVIADAS.includes(c.estado)&&mesC(c)<mesKey(n)&&!S.extratos[mesC(c)]).map(mesC))])add('warn',`Enviar o extrato de ${mesNome(m)} ao ${S.jogador}`,extAbertas(m)?`${extAbertas(m)} ${extAbertas(m)===1?'evento ainda em aberto':'eventos ainda em aberto'}: podes esperar ou enviar já`:'Fecha as contas do contrato do mês',['contratos']);
  if(papel==='jogador')for(const m in S.extratos||{})if(!(S.extratosConf||{})[m]&&!(S.extratosDisp||{})[m])add('warn',`Confirma o extrato de ${mesNome(m)}`,'Fecha as contas das compras do mês. Se algo não bate, carrega em "Algo não bate"',['compras','@contrato']);
  if(papel==='gestao')for(const m in S.extratosDisp||{})add('warn',`O ${S.jogador} diz que o extrato de ${mesNome(m)} não bate`,(S.extratosDisp[m].txt||'').slice(0,140),['contratos']);

    add(at?'err':'warn',`Devolve ${money(tot,mo)} à Polarize${um?' · '+curto(um.c.nome):` (${L.length} devoluções)`}`,`${um?cap(TIPO_DEV[um.x.tipo])+': ':L.map(o=>curto(o.c.nome)+' '+money(o.x.valor,mo)).join(' · ')+'. '}${at?`em atraso${a>=1?' há '+a+(a===1?' dia':' dias'):''} (era até ${dd(v)})`:`até ${dd(v)}`}. ${um&&um.x.tipo==='luxon'?'Está na tua Luxon. Se afinal o puseste na sala, abre a compra e carrega em "Afinal pus na sala".':um&&um.x.tipo==='diferenca'?'Faltou numa devolução anterior.':'Uma só transferência.'}`,['operacoes',L[0].c.pid+':'+L[0].x.i],v)}

  const o={err:0,warn:1,info:2};return A.sort((a,b)=>o[a.nv]-o[b.nv]||a.pz-b.pz)}
function proximoEvento(){const n=NOW(),T=[];for(const c of S.compras){if(['revisao','aprovada','enviada'].includes(c.estado))T.push(ini(c));if(['aprovada','enviada'].includes(c.estado))T.push(fimLR(c));if(c.estado==='na_sala'){T.push(fimDia1(c));for(const f of c.flights||[])T.push(ini(f))}if(c.estado==='aberta')T.push(inicioDia2(c),fimDia2(c));for(const x of devPend(c))T.push(x.t+24*H,x.t+48*H)}
  return T.filter(t=>t>n+6e4).sort((a,b)=>a-b)[0]||null}

function empurrar(){if(!NUVEM||NUVEM.estado==='a ligar')return;if(NUVEM.aEnviar){NUVEM.pendente=true;return}const j=JSON.stringify(S);if(j===NUVEM.sync)return;NUVEM.aEnviar=true;
  rpc('ce_teste_gravar',{p_codigo:NUVEM.c,p_sala:NUVEM.sala,p_estado:S,p_versao:NUVEM.versao}).then(r=>{NUVEM.falhas=0;
    if(r.ok){NUVEM.versao=r.versao;NUVEM.sync=j;estadoNuvem('ligado')}
    else if(r.estado){let base=null;try{base=JSON.parse(NUVEM.sync)}catch(x){}const f=base&&fundir(base,JSON.parse(j),r.estado);NUVEM.versao=r.versao;NUVEM.sync=JSON.stringify(r.estado);
      if(f){S=f}else{S=r.estado;aplicarTempo();if(JSON.stringify(S)!==j)avisar('As duas janelas mexeram na mesma coisa ao mesmo tempo: ficou o que a outra gravou. Confirma a tua última ação.',1)}UI.keepScroll=true;render()}
    else{NUVEM.versao=r.versao;NUVEM.pendente=true}})
  .catch(e=>{NUVEM.falhas++;estadoNuvem('sem ligação');NUVEM.pendente=true}).finally(()=>{NUVEM.aEnviar=false;if(NUVEM.pendente){NUVEM.pendente=false;setTimeout(empurrar,NUVEM.falhas?3000:0)}})}
const canon=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,kk)=>(o[kk]=v[kk],o),{}):v);
function fundir(b,l,r){if(l.geracao!==b.geracao)return l;if(r.geracao!==b.geracao)return r;const out={...r},J=canon;for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const sb=J(b[k]),sl=J(l[k]),sr=J(r[k]);if(sl===sb||sl===sr)continue;if(sr===sb){out[k]=l[k];continue}
    if(k==='compras'){const id=c=>c.pid,mb=new Map((b[k]||[]).map(c=>[id(c),J(c)])),ml=new Map((l[k]||[]).map(c=>[id(c),c])),res=[];for(const c of r[k]||[]){const x=ml.get(id(c));if(!x||J(x)===mb.get(id(c))||J(x)===J(c)){res.push(c);continue}if(J(c)===mb.get(id(c))){res.push(x);continue}return null}
      for(const [p,x] of ml)if(!(r[k]||[]).some(c=>id(c)===p)){if(mb.has(p))return null;res.push(x)}out[k]=res;continue}
    if(k==='ops'||k==='sessoes'){const sbs=new Set((b[k]||[]).map(J)),srs=new Set((r[k]||[]).map(J)),novos=(l[k]||[]).filter(x=>!sbs.has(J(x))&&!srs.has(J(x)));if(k==='sessoes'&&novos.some(x=>(r[k]||[]).some(y=>y.dia===x.dia)))return null;out[k]=[...(r[k]||[]),...novos];continue}
    return null}return out}
async function puxar(){if(!NUVEM||NUVEM.aEnviar)return;try{const r=await rpc('ce_teste_ler',{p_codigo:NUVEM.c,p_sala:NUVEM.sala,p_desde:NUVEM.versao});NUVEM.falhas=0;
    if(NUVEM.estado==='a ligar'){if(r.estado){NUVEM.versao=r.versao;NUVEM.sync=JSON.stringify(r.estado);estadoNuvem('ligado');S=r.estado;render()}else{const t=S.tema;S=NOVO();S.tema=t;NUVEM.versao=0;estadoNuvem('ligado');render()}return}
    estadoNuvem('ligado');if(r.estado&&r.versao>NUVEM.versao&&!NUVEM.aEnviar&&JSON.stringify(S)===NUVEM.sync){NUVEM.versao=r.versao;NUVEM.sync=JSON.stringify(r.estado);aplicarEstado(r.estado)}}
  catch(e){NUVEM.falhas++;estadoNuvem(/codigo_errado/.test(e.message)?'código errado':/404|PGRST202/.test(e.message)?'caixa por criar':'sem ligação')}}
if(NUVEM){puxar();setInterval(puxar,1500)}
let ultEstreito=estreito();window.addEventListener('resize',()=>{if(estreito()!==ultEstreito){ultEstreito=estreito();render()}});
render();
