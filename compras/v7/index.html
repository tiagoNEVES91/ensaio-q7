<p><b>Contrato-quadro de compras de ação · ${cap(mesAno(m))}</b><br>Aditamento ao Acordo de Parceria de Poker Staking e Coaching em vigor entre a Polarize Poker Limited (Sociedade) e ${J}${S.nick?', nick '+esc(S.nick):''} (Jogador).</p>
<p><b>1. Modelo.</b> Em cada evento acordado, uma % do buy-in é investida pelo modelo de Staking 50-50 do Acordo e outra % pelo modelo Compra de Ação. Na Compra de Ação a Sociedade investe o montante dessa %, o Jogador partilha os ganhos do evento na mesma % e não há make-up em caso de perdas. As cláusulas do Acordo aplicam-se em tudo o que não for incompatível.</p>
<p><b>2. Schedule.</b> O schedule deste mês são os pedidos que o Jogador faz no tracker e que a Sociedade aprova antes do início de cada evento. Cada pedido aprovado fixa o evento, o buy-in e o rake, o número máximo de entradas, a % de cada modelo, o rakeback da parte da Sociedade e, em salas em euros, o câmbio. O acordo de cada evento fica feito no momento da aprovação e pertence ao mês do pedido.</p>
<p><b>3. Envio e inscrição.</b> A Sociedade transfere o valor para a Luxon Pay do Jogador, já líquido do rakeback da parte dela${soG('o aditamento atual manda o Jogador devolvê-lo depois')}. O Jogador põe o valor na sala e faz a inscrição. Esse dinheiro só serve para esse evento.</p>
<p><b>4. Resultado e prova.</b> O Jogador regista no tracker, na sessão de cada dia de jogo e no máximo 48 h depois, as entradas usadas e o prémio; no dia em que o evento acaba para ele, junta a hand history do evento${soG('e o print do resultado')}. Se não reportar um prémio em 48 h, a Sociedade pode rescindir com justa causa e o Jogador paga um valor igual ao prémio, além do próprio prémio. Sem prova da participação, a penalização é de uma vez o buy-in (em perdas) ou uma vez o prémio (em ganhos).${soG('esclarecer se a penalização é sobre o total ou sobre a parte da Sociedade, e por entrada ou por evento')}</p>
<p><b>5. Devoluções.</b> As entradas que deixam de poder ser usadas (o Jogador passou ao dia seguinte, caiu no último flight ou fechou o late reg) e a % da Sociedade em cada prémio, bounties incluídos, devolvem-se no dia em que isso acontece ou em que o dinheiro entra na sala, com print do envio no tracker. Se a Sociedade receber menos do que o devido, a diferença continua em dívida.${soG('quem paga as comissões das transferências')}</p>
