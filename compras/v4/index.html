  --bg:hsl(30 6% 6%);--card:hsl(30 6% 10%);--fg:hsl(40 15% 93%);--muted:hsl(35 6% 62%);
  --line:hsl(30 5% 20%);--soft:hsl(30 5% 15%);--primary:hsl(45 90% 55%);--primary-fg:hsl(30 10% 8%);

  --line:hsl(30 5% 20%);--soft:hsl(30 5% 15%);--primary:hsl(45 90% 55%);--primary-fg:hsl(30 10% 8%);

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:19px;margin:0;flex:1;line-height:1.2}
.top .who{font-size:12px;color:var(--muted);font-weight:500}
.back{border:0;background:none;color:var(--fg);font-size:22px;padding:2px 8px 2px 0;cursor:pointer}
.theme{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:600 13px Inter,sans-serif;padding:6px 10px;cursor:pointer}
.banca{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.banca::-webkit-scrollbar{display:none}
.banca span{flex:none;font-size:12px;background:var(--soft);border-radius:6px;padding:3px 8px;color:var(--muted)}
.banca b{color:var(--fg);font-weight:600}
main{flex:1;padding:12px 16px 150px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;color:var(--muted);font:600 12px Inter,sans-serif;padding:9px 2px 10px;cursor:pointer;position:relative}
nav.tabs button .ic{display:block;font-size:19px;line-height:1.1}
nav.tabs button[aria-pressed="true"]{color:var(--fg)}
nav.tabs button[aria-pressed="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}
nav.tabs .dot{position:absolute;top:6px;right:24%;width:8px;height:8px;border-radius:50%;background:var(--err)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 15px Inter,sans-serif;cursor:pointer}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}.tag.err{background:var(--err-bg);color:var(--err)}
input.i,select.i,textarea.i{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:16px Inter,sans-serif;padding:8px 12px}
select.i.sm{min-height:36px;font-size:14px;padding:4px 6px}
label.l{display:block;font-weight:600;margin:14px 0 6px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.h2{font-size:17px;font-weight:700;margin:18px 0 8px}
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--fg);font:inherit;cursor:pointer}
.t .nm{font-weight:600;line-height:1.3}

.hr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hr b{font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
.sum .r .k{color:var(--muted)}
.sum .r>span:last-child{white-space:nowrap}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.warn{background:var(--warn-bg);color:var(--warn)}.msg.err{background:var(--err-bg);color:var(--err)}.msg.info{background:var(--info-bg);color:var(--info)}
.guia{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.guia b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.guia .btn{flex:none;margin-left:auto}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.step .v{text-align:center;font-size:20px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.foot{position:fixed;left:0;right:0;bottom:62px;z-index:6}
.foot .in{max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.foot .line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.foot .line b{color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.small{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:10px}
ol.next{padding-left:20px;margin:8px 0 0}ol.next li{margin:5px 0}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx th,table.mx td{border:1px solid var(--line);padding:5px 4px;text-align:center}
table.mx th{background:var(--soft);font-weight:600}
table.ex{width:100%;border-collapse:collapse;font-size:12px}

table.ex th:first-child,table.ex td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
.compra{border-left:4px solid var(--primary)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
</style>

function avaliar(t,pct,usd){
  const M=S.matriz;const iN=M.niveis.findIndex(x=>S.nivel<=x.max);const bi=t.buyin+t.rake;const iF=M.faixas.findIndex(x=>bi<=x.max);
  const c=M.celulas[iN][iF];const out=[];
  out.push(aberto(t)?['ok',`Dentro do prazo (até ${LIMITE_HORAS} h antes)`]:['err','Prazo fechado']);
  out.push(c.p===0?['warn',`Nível ${String(S.nivel).replace('.',',')} não tem compras aprovadas sozinhas nesta faixa de buy-in`]:
    pct<=c.p+1e-9?['ok',`% até ${pctTxt(c.p)} (nível ${M.niveis[iN].n}, buy-in ${M.faixas[iF].n})`]:['warn',`% acima de ${pctTxt(c.p)} para o teu nível nesta faixa`]);
  if(c.p>0)out.push(usd<=c.v+.005?['ok',`Valor até ${money(c.v)}`]:['warn',`Valor acima de ${money(c.v)} para o teu nível nesta faixa`]);
  const gtdMin=M.gtdMult*bi;out.push(!t.garantido||t.garantido>=gtdMin?['ok',`Garantido de pelo menos ${M.gtdMult}× o buy-in`]:['warn',`Garantido baixo (${money(t.garantido)}; mínimo ${money(gtdMin)})`]);
  const ab=emAberto()+usd;out.push(ab<=M.abertoMax?['ok',`Total em aberto até ${money(M.abertoMax)}`]:['warn',`Ficavas com ${money(ab)} em aberto (máximo ${money(M.abertoMax)})`]);
  return out;
}

function novaSessao(){
  const salas=S.salas.filter(s=>s.compra>0).map(s=>s.id);if(!salas.length)salas.push('gg');
  UI.sess={inicio:'',fim:'',ntorneios:'',salas:salas.map(id=>({id,final:''})),compras:{}};
}
function compraDaSala(id){return S.compras.filter(c=>c.salaId===id&&['na_sala','aberta'].includes(c.estado))}
function calcSala(row){
  // saldo do deal = saldo final real − dinheiro da compra que continua na sala − o que se devolve à Polarize
  const s=S.salas.find(x=>x.id===row.id);const fin=num(row.final);
  let keep=0,novoDev=0;const falta=[];
  const pend=r2(S.compras.filter(c=>c.salaId===s.id&&c.estado==='a_devolver').reduce((a,c)=>a+c.devolver,0));
  for(const c of compraDaSala(s.id)){
    const r=UI.sess.compras[c.pid];
    if(!r||!r.estado){falta.push(c);keep+=c.naSala;continue}
    if(r.estado==='nao'){keep+=c.naSala;continue}
    const usadas=Math.min(c.ent,(c.usadas||0)+(r.usadas||1));
    const restoEnt=r2((c.ent-usadas)*c.porEntrada);
    const pITM=r2((num(r.premio)||0)*c.pct+(c.devPremioAcum||0));
    if(c.varios_dias&&r.acabou==='nao')keep+=restoEnt+pITM;else novoDev+=restoEnt+pITM;
  }
  keep=r2(keep+pend);novoDev=r2(novoDev);
  const finalDeal=isNaN(fin)?NaN:r2(fin-keep-novoDev);
  return {s,fin,keep,novoDev,finalDeal,pl:isNaN(finalDeal)?NaN:r2(finalDeal-s.saldo),falta};
}

function sessaoValida(){
  const F=UI.sess;if(!F)return 'Falta preencher';
  if(!/^\d{2}:\d{2}$/.test(F.inicio)||!/^\d{2}:\d{2}$/.test(F.fim))return 'Faltam as horas (HH:MM)';
  for(const row of F.salas){const k=calcSala(row);if(isNaN(k.fin))return 'Falta o Saldo Final';if(k.falta.length)return 'Diz como correu a compra';if(k.finalDeal<0)return 'O saldo do deal não pode ser negativo'}
  if(!(num(F.ntorneios)>0))return 'Falta o N° de torneios';
  return '';
}
function criarSessao(){
  const F=UI.sess;const linhas=[];
  for(const row of F.salas){
    const k=calcSala(row),s=k.s;
    for(const c of compraDaSala(s.id)){
      const r=F.compras[c.pid];if(!r||r.estado==='nao')continue;
      c.usadas=Math.min(c.ent,(c.usadas||0)+(r.usadas||1));
      const premio=num(r.premio)||0;c.premio=r2((c.premio||0)+premio);
      const restoEnt=r2((c.ent-c.usadas)*c.porEntrada);
      const acum=r2((c.devPremioAcum||0)+premio*c.pct);
      if(c.varios_dias&&r.acabou==='nao'){c.devPremioAcum=acum;c.naSala=r2(restoEnt+acum);c.estado='aberta'}
      else{c.devPremio=acum;c.devEntradas=restoEnt;c.devolver=r2(acum+restoEnt);c.naSala=0;c.estado=c.devolver>0?'a_devolver':'fechada'}
    }
    s.compra=r2(compraDaSala(s.id).reduce((a,c)=>a+c.naSala,0)+S.compras.filter(c=>c.salaId===s.id&&c.estado==='a_devolver').reduce((a,c)=>a+c.devolver,0));
    linhas.push({sala:s.nome,moeda:s.moeda,inicial:s.saldo,finalReal:k.fin,finalDeal:k.finalDeal,pl:k.pl});
    S.makeup[s.moeda]=r2(S.makeup[s.moeda]+k.pl);s.saldo=k.finalDeal;
  }
  S.sessoes.push({data:hojeTxt(),linhas});UI.sess=null;guardar();
  UI.flash='Sessão criada com sucesso';render();window.scrollTo(0,0);
}
function vSessoes(){
  if(!S.sessoes.length)return '';
  return `<div class="h2">Sessões registadas</div>`+S.sessoes.slice().reverse().map(x=>`<div class="card"><b>${esc(x.data)}</b>${x.linhas.map(l=>`<div class="small" style="margin-top:4px">${esc(l.sala)}: saldo final ${money(l.finalReal,l.moeda)} → deal ${money(l.finalDeal,l.moeda)} · P&L <b style="color:var(--${l.pl>=0?'ok':'err'})">${l.pl>=0?'+':''}${money(l.pl,l.moeda)}</b></div>`).join('')}</div>`).join('');
}

// ---------------- ecrãs: gestão ----------------
function vGestao(){
  let h='';
  const rev=S.compras.filter(c=>c.estado==='revisao'),apr=S.compras.filter(c=>c.estado==='aprovada'),conf=S.compras.filter(c=>c.estado==='devolucao_enviada');
  h+=`<div class="h2" style="margin-top:4px">Por decidir</div>`;
  if(!rev.length)h+=`<div class="small">Nada: tudo o que entrou passou na matriz.</div>`;
  for(const c of rev)h+=`<div class="card"><div class="hr"><span style="font-weight:600">${esc(curto(c.nome))}</span><b>${money(c.valor,c.moeda)}</b></div>
    <div class="small">${esc(S.jogador)} · nível ${String(S.nivel).replace('.',',')} · ${pctTxt(c.pct)} · ${c.ent} ${c.ent===1?'entrada':'entradas'}</div>
    ${c.motivos.map(m=>`<div class="small" style="color:var(--warn)">! ${esc(m)}</div>`).join('')}
    <div class="seg" style="margin-top:8px"><button class="btn sm p" data-g="aprovar" data-pid="${c.pid}">Aprovar</button><button class="btn sm" data-g="recusar" data-pid="${c.pid}">Recusar</button></div></div>`;
  h+=`<div class="h2">Por enviar (Luxon)</div>`;
  if(!apr.length)h+=`<div class="small">Nada por enviar.</div>`;
  for(const c of apr)h+=`<div class="card"><div class="hr"><span style="font-weight:600">${esc(curto(c.nome))}</span><b>${money(c.valor,c.moeda)}</b></div>
    <div class="small">${esc(S.jogador)} · para a Luxon Pay ${c.moeda} · ${c.aprov==='matriz'?'aprovada pela matriz':'aprovada pela gestão'}</div>
    <button class="btn sm p" style="margin-top:8px" data-g="enviar" data-pid="${c.pid}">Enviei ${money(c.valor,c.moeda)}</button></div>`;
  h+=`<div class="h2">Devoluções por confirmar</div>`;
  if(!conf.length)h+=`<div class="small">Nenhuma.</div>`;
  for(const c of conf)h+=`<div class="card"><div class="hr"><span style="font-weight:600">${esc(curto(c.nome))}</span><b>${money(c.devolver,c.moeda)}</b></div>
    <div class="small">${esc(S.jogador)} · print: ${esc(c.print||'—')}</div><button class="btn sm p" style="margin-top:8px" data-g="receber" data-pid="${c.pid}">Confirmar Receção</button></div>`;
  h+=vMatriz()+vExtrato();
  return h;
}
function vMatriz(){
  const M=S.matriz;
  let h=`<div class="h2">Matriz de aprovação</div><div class="small" style="margin-bottom:8px">Cada célula: % máxima e valor máximo que a matriz aprova sozinha, por nível do jogador e buy-in. Fora disto vai para a gestão. Valores de exemplo, para afinar.</div>
  <div class="scroll"><table class="mx"><tr><th>Nível</th>${M.faixas.map(f=>`<th>${esc(f.n)}</th>`).join('')}</tr>`;
  M.niveis.forEach((n,i)=>{h+=`<tr><th>${esc(n.n)}</th>${M.faixas.map((f,j)=>{const c=M.celulas[i][j];return `<td><select class="i sm" data-mx="${i},${j},p">${[0,.3,.4,.5,.6,.7,.8].map(p=>`<option value="${p}"${c.p===p?' selected':''}>${p?pctTxt(p):'—'}</option>`).join('')}</select>${c.p?`<div class="small">${money(c.v)}</div>`:''}</td>`}).join('')}</tr>`});
  h+=`</table></div>
  <div class="g2" style="margin-top:8px"><div><label class="l" style="margin-top:4px">Garantido mínimo (× buy-in)</label><input class="i" data-mxg="gtdMult" inputmode="numeric" value="${M.gtdMult}"></div>
  <div><label class="l" style="margin-top:4px">Máximo em aberto por jogador</label><input class="i" data-mxg="abertoMax" inputmode="numeric" value="${M.abertoMax}"></div></div>
  <label class="l">Nível do ${esc(S.jogador)} (para testar)</label><div class="chips">${[5.5,6,6.5,7,7.5].map(n=>`<button class="chip" data-nivel="${n}" aria-pressed="${S.nivel===n}">${String(n).replace('.',',')}</button>`).join('')}</div>`;
  return h;
}
function vExtrato(){
  const cs=S.compras.filter(c=>!['recusada','cancelada','revisao'].includes(c.estado));
  let h=`<div class="h2">Extrato de ${esc(S.mes)} · ${esc(S.jogador)}</div><div class="small" style="margin-bottom:8px">É o anexo do contrato do mês. Contrato: ${S.contrato?'<b style="color:var(--ok)">aceite</b>':'<b style="color:var(--warn)">por aceitar</b>'}.</div>`;
  if(!cs.length)return h+`<div class="small">Ainda sem compras.</div>`;
  h+=`<div class="scroll"><table class="ex"><tr><th>Torneio</th><th>%</th><th>Ent.</th><th>Enviado</th><th>Prémio</th><th>Devolvido</th><th>Estado</th></tr>${cs.map(c=>`<tr><td>${esc(curto(c.nome))}</td><td>${pctTxt(c.pct)}</td><td>${c.usadas||0}/${c.ent}</td><td>${money(c.valor,c.moeda)}</td><td>${c.premio?money(c.premio,c.moeda):'—'}</td><td>${c.estado==='fechada'&&c.devolver?money(c.devolver,c.moeda):c.estado==='a_devolver'||c.estado==='devolucao_enviada'?'por receber':'—'}</td><td>${esc(ESTADOS[c.estado])}</td></tr>`).join('')}</table></div>`;
  return h;
}
const ESTADOS={revisao:'em revisão',aprovada:'aprovada',enviada:'enviada',na_sala:'na sala',aberta:'a decorrer',a_devolver:'a devolver',devolucao_enviada:'devolução enviada',fechada:'fechada',recusada:'recusada',cancelada:'cancelada'};

// ---------------- render ----------------
function render(){
  $('#banca').innerHTML=S.salas.map(s=>`<span>${esc(s.rede)} <b>${money(s.saldo,s.moeda)}</b>${s.compra?` + compra ${money(s.compra,s.moeda)}`:''}</span>`).join('')+`<span>Makeup <b>${money(S.makeup.USD)}</b>${S.makeup.EUR?` · ${money(S.makeup.EUR,'EUR')}`:''}</span>`;
  const T=[['vender','🎯','Vender ação',0],['sessao','📝','Sessão',0],['ops','💸','Operações',pendentesJogador()],['gestao','🛡','Gestão',pendentesGestao()]];
  $('#tabs').innerHTML=T.map(([k,ic,n,p])=>`<button data-tab="${k}" aria-pressed="${UI.tab===k}"><span class="ic">${ic}</span>${n}${p?'<span class="dot"></span>':''}</button>`).join('');
  const sub=UI.tab==='vender'&&UI.step!=='lista'||UI.tab==='ops'&&UI.op;
  $('#back').hidden=!sub;
  $('#ttl').textContent=UI.tab==='vender'?(UI.step==='pedido'?'Pedido de compra':UI.step==='contrato'?'Contrato do mês':UI.step==='enviado'?'Pedido feito':'Vender ação'):UI.tab==='sessao'?'Nova Sessão':UI.tab==='ops'?(UI.op?(UI.op.tipo==='pôr'?'Pôr na sala':'Devolver à Polarize'):'Operações'):'Gestão';
  let h='';const g=guia();
  if(g&&!(UI.tab==='vender'&&UI.step!=='lista'))h+=`<div class="guia"><div><b>${esc(g[0])}</b>${esc(g[1])}</div>${g[2]!==UI.tab?`<button class="btn sm" data-tab="${g[2]}">Ir</button>`:''}</div>`;
  if(UI.flash){h+=`<div class="msg ok">${esc(UI.flash)}</div>`;UI.flash=''}
  if(UI.tab==='vender')h+=UI.step==='pedido'?vPedido():UI.step==='contrato'?vContrato():UI.step==='enviado'?vEnviado(S.compras[S.compras.length-1]):vLista();
  else if(UI.tab==='sessao')h+=vSessao()+vSessoes();
  else if(UI.tab==='ops')h+=UI.op?vOpForm():vOps();
  else h+=vGestao()+`<button class="btn" style="width:100%;margin-top:20px" data-act="reset">Recomeçar a simulação</button>`;
  $('#main').innerHTML=h;foot();ligar();
}
function foot(){
  const f=$('#foot'),fi=$('#footIn');
  if(UI.tab==='vender'&&UI.step==='pedido'){
    const t=UI.sel,rb=num(UI.rb)/100,ok=UI.rb!==''&&rb>=0&&rb<=1&&aberto(t);const sala=salaDaRede(t.sala);
    const v=ok?money(contas(t,UI.pct,UI.ent,rb,sala.moeda,UI.fx).valor,sala.moeda):'—';
    f.hidden=false;fi.innerHTML=`<div class="line"><span>Recebes</span><b>${v}</b></div><button class="btn p big" data-act="pedir" ${ok?'':'disabled'}>${!aberto(t)?'Prazo fechado':UI.rb===''?'Falta o teu rakeback':'Pedir compra'}</button>`;return}
  if(UI.tab==='sessao'){const e=sessaoValida();let pl='';
    if(UI.sess)for(const row of UI.sess.salas){const k=calcSala(row);if(!isNaN(k.pl))pl+=`${pl?' · ':''}${k.s.rede} <b style="color:var(--${k.pl>=0?'ok':'err'})">${k.pl>=0?'+':''}${money(k.pl,k.s.moeda)}</b>`}
    f.hidden=false;fi.innerHTML=`<div class="line"><span>P&L do deal</span><span>${pl||'—'}</span></div><button class="btn p big" data-act="criarSessao" ${e?'disabled':''}>${e||'Criar Sessão'}</button>`;return}
  f.hidden=true;
}
function ligar(){
  const keep=(id,fn)=>{const el=document.getElementById(id);if(el)el.oninput=e=>{fn(e.target.value);const pos=e.target.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}};
  keep('q',v=>UI.q=v);keep('rb',v=>UI.rb=v.replace(/[^\d.,]/g,''));
  const fh=v=>{const t=v.replace(/\D/g,'').slice(0,4);return t.length===4?t.slice(0,2)+':'+t.slice(2):t};
  keep('sIni',v=>UI.sess.inicio=fh(v));keep('sFim',v=>UI.sess.fim=fh(v));keep('sNt',v=>UI.sess.ntorneios=v.replace(/\D/g,''));
  document.querySelectorAll('[data-final]').forEach(el=>{el.id='fin'+el.dataset.final;keep(el.id,v=>UI.sess.salas[+el.dataset.final].final=v)});
  document.querySelectorAll('[data-cp]').forEach(el=>{el.id='cp'+el.dataset.cp;keep(el.id,v=>{(UI.sess.compras[el.dataset.cp]||={}).premio=v})});
  document.querySelectorAll('[data-salarow]').forEach(el=>el.onchange=e=>{UI.sess.salas[+el.dataset.salarow].id=e.target.value;render()});
  document.querySelectorAll('[data-mx]').forEach(el=>el.onchange=e=>{const [i,j]=el.dataset.mx.split(',').map(Number);const c=S.matriz.celulas[i][j];c.p=parseFloat(e.target.value);if(c.p&&!c.v)c.v=5000;guardar();render()});
  document.querySelectorAll('[data-mxg]').forEach(el=>el.onchange=e=>{const v=num(e.target.value);if(v>0){S.matriz[el.dataset.mxg]=v;guardar()}render()});
  const pf=document.getElementById('printDev');if(pf)pf.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f){UI.op.print=f.name;render()}};
}
function pedir(){
  const t=UI.sel,sala=salaDaRede(t.sala),rb=num(UI.rb)/100;
  if(!S.contrato){UI.step='contrato';render();window.scrollTo(0,0);return}
  const c=contas(t,UI.pct,UI.ent,rb,sala.moeda,UI.fx);const ck=avaliar(t,UI.pct,c.usd);const passa=ck.every(x=>x[0]==='ok');
  S.compras.push({pid:Date.now().toString(36),id:t.id,nome:t.nome,sala:t.sala,salaId:sala.id,salaNome:sala.nome,inicio:t.inicio,varios_dias:t.varios_dias,
    pct:UI.pct,ent:UI.ent,rb,moeda:sala.moeda,valor:c.valor,usd:c.usd,porEntrada:c.porEntrada,estado:passa?'aprovada':'revisao',aprov:passa?'matriz':null,
    motivos:ck.filter(x=>x[0]!=='ok').map(x=>x[1]),usadas:0,naSala:0,premio:0});
  guardar();UI.step='enviado';render();window.scrollTo(0,0);
}
const agora=()=>new Date().toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.tab){UI.tab=ds.tab;UI.op=null;if(ds.tab==='vender')UI.step='lista';render();window.scrollTo(0,0);return}
  if(b.id==='back'){if(UI.tab==='ops')UI.op=null;else UI.step=UI.step==='contrato'?'pedido':'lista';render();return}
  if(ds.go){UI.tab=ds.go;UI.op=null;render();window.scrollTo(0,0);return}
  if(ds.sala){UI.sala=ds.sala;render();return}
  if(ds.dia){UI.dia=ds.dia;render();return}
  if(ds.id){const t=CAT.torneios.find(x=>x.id===ds.id);if(!t||!aberto(t))return;UI.sel=t;UI.pct=.5;UI.ent=1;UI.rb=(S.rbSala||{})[t.sala]||'';UI.step='pedido';render();window.scrollTo(0,0);return}
  if(ds.pct){UI.pct=parseFloat(ds.pct);render();return}
  if(ds.ent&&UI.tab==='vender'){UI.ent=Math.max(1,Math.min(20,UI.ent+parseInt(ds.ent,10)));render();return}
  if(ds.nivel){S.nivel=parseFloat(ds.nivel);guardar();render();return}
  const a=ds.act;
  if(a==='pedir'){(S.rbSala||={})[UI.sel.sala]=UI.rb;pedir();return}
  if(a==='aceitarContrato'){S.contrato=true;guardar();pedir();return}
  if(a==='reset'){S=NOVO();guardar();UI.tab='vender';UI.step='lista';UI.sess=null;UI.op=null;render();window.scrollTo(0,0);return}
  if(ds.op){UI.op={tipo:ds.op,pid:ds.pid};render();window.scrollTo(0,0);return}
  if(a==='confirmarPor'){const c=S.compras.find(x=>x.pid===UI.op.pid);S.luxon[c.moeda]=r2(S.luxon[c.moeda]-c.valor);c.estado='na_sala';c.naSala=c.valor;
    const s=S.salas.find(x=>x.id===c.salaId);s.compra=r2(s.compra+c.valor);
    S.ops.push({tipo:'Compra de ação → sala',desc:`${curto(c.nome)} · Luxon Pay ${c.moeda} → ${c.salaNome} (fora da banca)`,valor:c.valor,moeda:c.moeda,estado:'Finalizado',data:agora()});
    UI.op=null;UI.flash='Dinheiro da compra registado na sala. A tua banca do deal não mudou.';guardar();render();return}
  if(a==='confirmarDev'){const c=S.compras.find(x=>x.pid===UI.op.pid);c.estado='devolucao_enviada';c.print=UI.op.print;
    const s=S.salas.find(x=>x.id===c.salaId);s.compra=r2(Math.max(0,s.compra-c.devolver));
    S.ops.push({tipo:'Devolução de compra de ação',desc:`${curto(c.nome)} · ${c.salaNome} → Luxon → Polarize`,valor:c.devolver,moeda:c.moeda,estado:'Pendente',data:agora(),pid:c.pid});
    UI.op=null;UI.flash='Devolução enviada. A gestão confirma a receção.';guardar();render();return}
  if(ds.g){const c=S.compras.find(x=>x.pid===ds.pid);
    if(ds.g==='aprovar'){c.estado='aprovada';c.aprov='gestao'}
    if(ds.g==='recusar'){c.estado='recusada'}
    if(ds.g==='enviar'){c.estado='enviada';S.luxon[c.moeda]=r2(S.luxon[c.moeda]+c.valor);S.ops.push({tipo:'Compra de ação recebida',desc:`${curto(c.nome)} · ${pctTxt(c.pct)} · Polarize → Luxon Pay ${c.moeda}`,valor:c.valor,moeda:c.moeda,estado:'Finalizado',data:agora()})}
    if(ds.g==='receber'){c.estado='fechada';const o=S.ops.find(x=>x.pid===c.pid&&x.estado==='Pendente');if(o)o.estado='Finalizado'}
    guardar();render();return}
  if(a==='criarSessao'){if(!sessaoValida())criarSessao();return}
  if(a==='novaSala'){const livre=S.salas.find(s=>!UI.sess.salas.some(r=>r.id===s.id));if(livre){UI.sess.salas.push({id:livre.id,final:''});render()}return}
  if(ds.rmsala){UI.sess.salas.splice(+ds.rmsala,1);render();return}
  if(ds.cj){(UI.sess.compras[ds.cj]||={}).estado=ds.v;if(ds.v==='sim'&&!UI.sess.compras[ds.cj].usadas)UI.sess.compras[ds.cj].usadas=1;render();return}
  if(ds.cu){const c=S.compras.find(x=>x.pid===ds.cu);const r=UI.sess.compras[ds.cu];r.usadas=Math.max(1,Math.min(c.ent-(c.usadas||0),(r.usadas||1)+parseInt(ds.v,10)));render();return}
  if(ds.ca){UI.sess.compras[ds.ca].acabou=ds.v;render();return}
});
render();
</script>
</body>
